min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
cilium-hubble = "1.20.4"
cloudflared = "2026.11.1"
flux2 = "2.10.1"
gh = "2.105.0"
gum = "2.0.2"
helm = "4.3.2"
helmfile = "1.8.5"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
markdownlint-cli2 = "0.24.2"
node = "26.13.1"
op = "2.42.0"
oxfmt = "0.74.0"
shellcheck = "0.11.0"
talosctl = "1.14.5"
"github:cloudnative-pg/cloudnative-pg" = "v1.30.2"
"github:home-operations/flate" = "0.7.3"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.3"
zizmor = "1.33.1"
"github:etcd-io/etcd" = "v3.7.4"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
