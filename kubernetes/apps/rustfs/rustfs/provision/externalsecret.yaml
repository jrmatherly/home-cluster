---
# Each pair is read from its consumer's own item. The script reads the keys as
# files named <consumer>-access-key and <consumer>-secret-key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-provision
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-provision-secret
    creationPolicy: Owner
    template:
      data:
        ai-kb-access-key: "{{ .ai_kb_access_key }}"
        ai-kb-secret-key: "{{ .ai_kb_secret_key }}"
        langfuse-access-key: "{{ .langfuse_access_key }}"
        langfuse-secret-key: "{{ .langfuse_secret_key }}"
        itsaplan-access-key: "{{ .itsaplan_access_key }}"
        itsaplan-secret-key: "{{ .itsaplan_secret_key }}"
  data:
    - secretKey: ai_kb_access_key
      remoteRef:
        key: ai-kb
        property: RUSTFS_ACCESS_KEY
    - secretKey: ai_kb_secret_key
      remoteRef:
        key: ai-kb
        property: RUSTFS_SECRET_KEY
    - secretKey: langfuse_access_key
      remoteRef:
        key: langfuse
        property: RUSTFS_ACCESS_KEY
    - secretKey: langfuse_secret_key
      remoteRef:
        key: langfuse
        property: RUSTFS_SECRET_KEY
    - secretKey: itsaplan_access_key
      remoteRef:
        key: itsaplan
        property: RUSTFS_ACCESS_KEY
    - secretKey: itsaplan_secret_key
      remoteRef:
        key: itsaplan
        property: RUSTFS_SECRET_KEY
