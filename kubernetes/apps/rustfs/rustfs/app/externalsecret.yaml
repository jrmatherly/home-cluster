---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rustfs-secret
    creationPolicy: Owner
    template:
      data:
        RUSTFS_ACCESS_KEY: "{{ .ACCESS_KEY }}"
        RUSTFS_SECRET_KEY: "{{ .SECRET_KEY }}"
  dataFrom:
    - extract:
        key: rustfs
