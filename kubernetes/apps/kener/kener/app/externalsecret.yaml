---
# The mail settings are all here because the host and the user name an account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kener
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kener-secret
    creationPolicy: Owner
    template:
      data:
        KENER_SECRET_KEY: "{{ .SECRET_KEY }}"
        SMTP_HOST: "{{ .SMTP_HOST }}"
        SMTP_PORT: "{{ .SMTP_PORT }}"
        SMTP_SECURE: "{{ .SMTP_SECURE }}"
        SMTP_USER: "{{ .SMTP_USER }}"
        SMTP_PASS: "{{ .SMTP_PASS }}"
        SMTP_FROM_EMAIL: "{{ .MAIL_FROM }}"
  dataFrom:
    - extract:
        key: kener
