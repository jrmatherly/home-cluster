---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kener-db
spec:
  # Six fields, seconds first: 04:30 UTC every day.
  schedule: "0 30 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: kener-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
