---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  chartRef:
    kind: OCIRepository
    name: radar
  interval: 1h
  values:
    fullnameOverride: radar
    auth:
      # Radar signs users in itself and acts as them through impersonation. In this
      # mode the chart also lets its ServiceAccount read every Secret and
      # impersonate any user, so treat the pod as cluster-admin.
      mode: oidc
      oidc:
        issuerURL: https://auth.${SECRET_DOMAIN}
        clientID: "7e7dc52d-9c82-44c0-9f99-1a443f4886ac"
        existingSecret: radar-oidc
        redirectURL: https://radar.${SECRET_DOMAIN}/auth/callback
        # Keeps a Pocket ID user or group from matching a built-in Kubernetes one.
        usernamePrefix: "oidc:"
        groupsPrefix: "oidc:"
    usageReporting:
      enabled: false
    # Radar starts in a disconnected mode when its database is unreachable and
    # does not retry, so hold it back until the database accepts connections.
    initContainers:
      - name: wait-for-database
        image: docker.io/library/busybox:1.38
        command: ["sh", "-c", "until nc -z -w 2 radar-db-rw 5432; do sleep 2; done"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      # The chart leaves this out, and the namespace enforces `restricted`.
      seccompProfile: { type: RuntimeDefault }
    httpRoute:
      enabled: true
      hostnames:
        - radar.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
    timeline:
      storage: postgres
      retention: 168h
      postgres:
        existingSecret: radar-db-app
        secretKey: uri
    traffic:
      prometheusUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
