---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-budget
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: actual-budget-secret
    creationPolicy: Owner
    template:
      data:
        ACTUAL_OPENID_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: actual-budget
