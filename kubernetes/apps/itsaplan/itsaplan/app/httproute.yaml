---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itsaplan
spec:
  hostnames: ["plan.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # The api lives under /api on the web's host, so the session cookie stays
    # __Host- on this hostname. The prefix is removed, so better-auth is reached
    # at /api/api/auth/... and the api's own routes at /api/...
    - matches:
        - path: { type: PathPrefix, value: /api }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: itsaplan-api
          port: 3000
    # OAuth discovery for MCP clients, served by the api at the root.
    - matches:
        - path: { type: PathPrefix, value: /.well-known/oauth-authorization-server }
        - path: { type: PathPrefix, value: /.well-known/oauth-protected-resource }
        - path: { type: PathPrefix, value: /.well-known/openid-configuration }
      backendRefs:
        - name: itsaplan-api
          port: 3000
    - backendRefs:
        - name: itsaplan-web
          port: 3001
---
# The only path the internet reaches. Git hosts deliver repository webhooks
# here, and the api checks each one against the project's webhook secret, so
# the route has no SecurityPolicy. No rewrite: the api serves /webhooks/git/
# at its root. Public DNS gets this hostname from this route, and the LAN keeps
# resolving it to the internal gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itsaplan-webhooks
spec:
  hostnames: ["plan.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: /webhooks/git/ }
          method: POST
      backendRefs:
        - name: itsaplan-api
          port: 3000
---
# The api sets no rate or size limit of its own on this path.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: itsaplan-webhooks
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: itsaplan-webhooks
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 10
            unit: Second
  requestBuffer:
    limit: 5Mi
