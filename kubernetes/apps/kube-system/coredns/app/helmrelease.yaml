---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    priorityClassName: system-cluster-critical
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # Pods can't resolve names that exist only on the internal gateway, because
          # the node resolvers are on the internet. Answer Pocket ID's name here, so
          # an OIDC client in the cluster can use the issuer URL with the WAN down.
          - name: hosts
            configBlock: |-
              192.168.22.11 auth.${SECRET_DOMAIN}
              fallthrough
          # unifi-dns writes the name of every route on the internal gateway to the
          # UniFi console, so its resolver answers the names the node resolvers
          # cannot. The node resolvers follow it, for when it does not answer. This
          # sits in the same server block as autopath, which resolves a pod's
          # search path here and would never reach a block of its own.
          - name: forward
            parameters: ${SECRET_DOMAIN} 192.168.1.254 /etc/resolv.conf
            configBlock: |-
              policy sequential
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
