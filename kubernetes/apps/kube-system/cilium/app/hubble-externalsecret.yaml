---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hubble-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hubble-oidc
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: cilium-hubble
