---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-snapshot-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: etcd-snapshot-backup
    creationPolicy: Owner
    template:
      data:
        ENDPOINT_HOST: "0d81a943ce00a742bb95d0861f4ad6c6.r2.cloudflarestorage.com"
        BUCKET: "{{ .BUCKET }}"
        ACCESS_KEY: "{{ .ACCESS_KEY }}"
        SECRET_KEY: "{{ .SECRET_KEY }}"
  dataFrom:
    - extract:
        key: etcd-backup
