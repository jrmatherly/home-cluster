---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: career-ops
spec:
  chartRef:
    kind: OCIRepository
    name: career-ops
  interval: 1h
  values:
    controllers:
      web:
        # One replica: lib/dir-lock.mjs judges lock staleness by pid, so a second
        # pod would take the first one's locks for stale.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jrmatherly/career-ops-server
              tag: latest@sha256:297ec4440702aca90e703d598aff067bf0dfda9eb0ddb5da87ddb441b000cbf2
            env:
              CAREER_OPS_ROOT: /data
              # A host name here also makes the server bind 0.0.0.0.
              CAREER_OPS_WEB_ALLOWED_HOSTS: career.${SECRET_DOMAIN}
              CAREER_OPS_SCHEDULER: external
              CAREER_OPS_SCHEDULER_DESCRIPTION: CronJob career-ops-scan-tick, every 15 minutes
              # The Claude CLI calls this CLIProxyAPI Service in place of Anthropic; its key is in the Secret.
              ANTHROPIC_BASE_URL: "http://cliproxyapi.llms.svc.cluster.local:8317"
              # The share features read these from the env before the data root's .env.
              PUBLISH_URL: https://cv.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: career-ops-secret
            probes:
              # The request guard refuses the pod IP the kubelet sends as Host and
              # always admits loopback hosts.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: &port 3000
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: career-ops-web
        ports:
          http:
            port: *port
    persistence:
      # The tracker, reports and CVs. The only copy; the volume-backup CronJob tars it.
      data:
        forceRename: career-ops-data
        retain: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /data
      # The Claude CLI's login state and settings, ~/.claude and ~/.claude.json.
      # The runtime orders mounts by path depth, so the .cache emptyDir below
      # lands inside this mount.
      home:
        forceRename: career-ops-home
        retain: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /home/app
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cache:
        type: emptyDir
        globalMounts:
          - path: /home/app/.cache
      # next start writes its image-optimizer cache here (deploy/Dockerfile).
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /app/web/.next/cache
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
