---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: career-ops
spec:
  hostnames: ["career.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: career-ops-web
          port: 3000
      # The /api/run event stream lasts up to 800 s.
      timeouts:
        request: 900s
