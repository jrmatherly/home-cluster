---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: career-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: career-ops-secret
    creationPolicy: Owner
    template:
      data:
        ANTHROPIC_AUTH_TOKEN: "{{ .ANTHROPIC_AUTH_TOKEN }}"
        PUBLISH_API_KEY: "{{ .PUBLISH_API_KEY }}"
  dataFrom:
    - extract:
        key: career-ops
