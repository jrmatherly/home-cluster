---
# No SecurityPolicy: share pages are public, and the account page has its own
# Pocket ID sign-in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: publish
spec:
  hostnames: ["cv.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: publish
          port: 8080
