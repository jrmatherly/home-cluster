---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: publish
spec:
  chartRef:
    kind: OCIRepository
    name: publish
  interval: 1h
  values:
    controllers:
      publish:
        # SQLite allows one writer, and the volume is pinned to one node.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jrmatherly/career-ops-publish
              tag: latest@sha256:e5d3523c7aa43e84250d80f48d6fd3a3bb3fb904dfad38971672da5f5768131a
            env:
              # The image's /home/node is read-only here; anything the auth CLI
              # caches goes to the tmp volume.
              HOME: /tmp
              # The image sets PUBLISH_BIND, PUBLISH_PORT and PUBLISH_DB (/data/publish.db).
              PUBLISH_BASE_URL: https://cv.${SECRET_DOMAIN}
              # The service matches peers exactly today, so the CIDR takes effect
              # only once career-ops matches CIDRs; until then every visitor keys as
              # the gateway pod. The header stays the image default, cf-connecting-ip,
              # which Cloudflare overwrites; the leftmost x-forwarded-for entry is
              # whatever the visitor sent.
              PUBLISH_TRUSTED_PROXIES: "10.42.0.0/16"
              POCKET_ID_CLIENT_ID: "419f6d61-f244-47b1-be03-956f2493fc83"
              POCKET_ID_DISCOVERY_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
            envFrom:
              - secretRef:
                  name: publish-secret
            probes:
              # No health route; the server listens only after its auth migration
              # succeeded.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # Shares, snapshots, comments and accounts. The only copy; the
      # publish-volume-backup CronJob copies it.
      data:
        forceRename: publish-data
        retain: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
