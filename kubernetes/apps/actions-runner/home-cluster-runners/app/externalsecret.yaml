---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-cluster-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-cluster-runners-secret
    creationPolicy: Owner
    template:
      data:
        github_token: "{{ .TOKEN }}"
  dataFrom:
    - extract:
        key: github-runner
