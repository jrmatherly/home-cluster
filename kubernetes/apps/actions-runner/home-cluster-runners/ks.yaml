---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-cluster-runners
spec:
  dependsOn:
    - name: arc-controller
  interval: 1h
  path: ./kubernetes/apps/actions-runner/home-cluster-runners/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner
  wait: false
