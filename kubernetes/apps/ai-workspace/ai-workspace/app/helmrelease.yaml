---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-workspace
spec:
  chartRef:
    kind: OCIRepository
    name: ai-workspace
  interval: 1h
  # Helm waits for the migrate hook, which on a first install also waits for
  # the database, longer than helm-controller's default 5m.
  timeout: 15m
  values:
    controllers:
      ai-workspace:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-database: &waitForDatabase
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command: ["sh", "-c", "until nc -z -w 2 ai-workspace-db-rw 5432; do sleep 2; done"]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: &image
              repository: ghcr.io/jrmatherly/ai-workspace
              tag: v2026.10.12@sha256:4dae3d40874d2c53f5b6923509521c1b113587e2b60ba148259f92d2f6efceca
            env:
              POSTGRES_PRISMA_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: ai-workspace-db-app
                    key: uri
              POSTGRES_URL_NON_POOLING: *databaseUrl
              AUTH_URL: https://ai.${SECRET_DOMAIN}
              AUTH_OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
              AUTH_OIDC_CLIENT_ID: "e29b812d-597f-4401-a4b5-3e2794839a81"
              LOCALAI_API_HOST: http://localai.ai.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: ai-workspace-secret
            probes:
              # The app has no health route, so the probes ask for a cheap JSON
              # endpoint that needs no input.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &probePath /api/trpc/backend.listCapabilities
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: *probePath
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 1Gi
      # One hook Job, never a step per replica: concurrent migrate runs time out
      # on Prisma's advisory lock (P1002). A failed run fails the release and
      # the old pods keep serving.
      migrate:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 840
        initContainers:
          wait-for-database: *waitForDatabase
          # The operator creates the vector extension from the Database object,
          # and nothing orders that before this hook on a fresh install. The
          # app role cannot create it, so the Job waits for it instead.
          wait-for-vector:
            dependsOn: [wait-for-database]
            image: *image
            command:
              - sh
              - -c
              - >-
                until echo "DO 'BEGIN IF NOT EXISTS (SELECT FROM pg_extension WHERE extname = ''vector'')
                THEN RAISE EXCEPTION ''vector extension missing''; END IF; END';"
                | /app/node_modules/.bin/prisma db execute --stdin; do sleep 5; done
            env:
              POSTGRES_URL_NON_POOLING: *databaseUrl
            securityContext: *securityContext
        containers:
          app:
            image: *image
            command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
            env:
              POSTGRES_URL_NON_POOLING: *databaseUrl
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: ai-workspace
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # next/image writes its optimized images here.
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
