---
# No SecurityPolicy: Seerr has no OIDC support, and its own Plex sign-in is
# the login, because household members use it to request titles.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
spec:
  hostnames: ["requests.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: seerr
          port: 5055
