---
# Every SecurityPolicy in the namespace uses this secret: one Pocket ID client
# carries one callback URL per app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: media-oidc
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: media
