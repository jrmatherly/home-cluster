---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
spec:
  hostnames: ["sonarr.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
---
# The API key is the credential on /api, as upstream, so a mobile client on the
# LAN works without the Pocket ID sign-in. This route stays off envoy-external,
# because an API key alone on the internet is what CVE-2026-30975 punished.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-api
spec:
  hostnames: ["sonarr.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: sonarr
          port: 8989
