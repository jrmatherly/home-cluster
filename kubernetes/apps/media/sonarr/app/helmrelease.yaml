---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: sonarr
  interval: 1h
  # The configure job is a post-install and post-upgrade hook, so the release
  # waits for it.
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # A key change rolls the pod in the same upgrade, so the configure
            # hook below reaches a pod that already runs the new key.
            media.keys/checksum: "506e4c4b087d1bb8"
        # SQLite on a local-path volume: two pods on the same database corrupt it.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
            env:
              # The gateway's Pocket ID sign-in and the NetworkPolicy are the
              # login, so Sonarr trusts whoever reaches it.
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: media-keys
                    key: SONARR_API_KEY
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__LOG__ANALYTICSENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__LOG__DBENABLED: "False"
              TZ: "America/New_York"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 8989
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
      # Runs after every install and upgrade and converges the settings below
      # through Sonarr's API. A failed run fails the release.
      configure:
        type: job
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation
          # A key change re-renders this and upgrades the release, so the hook
          # pushes the new keys into the app.
          media.keys/checksum: "506e4c4b087d1bb8"
        job:
          backoffLimit: 0
          activeDeadlineSeconds: 1200
        containers:
          app:
            image:
              repository: docker.io/alpine/k8s
              tag: 1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
            envFrom:
              - secretRef:
                  name: media-keys
            command: ["sh", "-eu", "-c"]
            args:
              - |
                api() {
                  m=$1 p=$2
                  shift 2
                  curl -fsS -X "$m" -H "X-Api-Key: $SONARR_API_KEY" -H "Content-Type: application/json" "$@" "http://sonarr:8989/api/v3$p"
                }
                # setting <name> <jq filter>: a config singleton, PUT only when the filter changes it.
                setting() {
                  cur=$(api GET "/config/$1")
                  cur=$(printf '%s' "$cur" | jq -S .)
                  new=$(printf '%s' "$cur" | jq -S "$2")
                  if [ "$cur" = "$new" ]; then echo "$1: unchanged"; return; fi
                  printf '%s' "$new" | api PUT "/config/$1/$(printf '%s' "$cur" | jq .id)" --data-binary @- >/dev/null
                  echo "$1: updated"
                }
                # provider <kind> <implementation> <name> <properties> <fields>: matched by name.
                # GET masks secrets, so an existing one is always PUT rather than compared.
                provider() {
                  schema=$(api GET "/$1/schema")
                  list=$(api GET "/$1")
                  body=$(printf '%s' "$schema" | jq --arg impl "$2" --arg name "$3" --argjson top "$(jq -n "$4")" --argjson f "$(jq -n "$5")" '
                    first(.[] | select(.implementation == $impl)) + $top | .name = $name
                    | .fields |= map(.name as $n | if $f | has($n) then .value = $f[$n] else . end)')
                  id=$(printf '%s' "$list" | jq --arg name "$3" 'first(.[] | select(.name == $name) | .id)')
                  if [ -n "$id" ]; then
                    printf '%s' "$body" | jq --argjson id "$id" '.id = $id' | api PUT "/$1/$id" --data-binary @- >/dev/null
                    echo "$1 $3: updated"
                  else
                    printf '%s' "$body" | api POST "/$1" --data-binary @- >/dev/null
                    echo "$1 $3: created"
                  fi
                }
                # ensure <path> <jq test> <body>: POST only when the test finds nothing.
                ensure() {
                  list=$(api GET "$1")
                  if printf '%s' "$list" | jq -e "$2" >/dev/null; then echo "$1: unchanged"; return; fi
                  printf '%s' "$3" | api POST "$1" --data-binary @- >/dev/null
                  echo "$1: created"
                }

                until curl -fsS -o /dev/null http://sonarr:8989/ping; do sleep 5; done
                echo "sonarr: up"
                # Sonarr tests the download client on save, and the test fails until
                # SABnzbd has the tv category. Five minutes, so a SABnzbd outage
                # fails this release fast instead of at the job deadline.
                n=60
                until curl -fsS "http://sabnzbd:8080/api?mode=get_cats&output=json&apikey=$SABNZBD_API_KEY" | jq -e 'any(.categories[]; . == "tv")' >/dev/null; do
                  n=$((n - 1))
                  [ "$n" -gt 0 ] || { echo "sabnzbd: no tv category after 5 minutes" >&2; exit 1; }
                  sleep 5
                done
                echo "sabnzbd: tv category present"

                # Recyclarr owns downloadPropersAndRepacks and naming.
                setting mediamanagement '
                  .episodeTitleRequired = "bulkSeasonReleases" | .copyUsingHardlinks = true
                  | .importExtraFiles = true | .extraFileExtensions = "srt,ass"
                  | .autoUnmonitorPreviouslyDownloadedEpisodes = false
                  | .rescanAfterRefresh = "always" | .fileDate = "none" | .enableMediaInfo = true
                  | .recycleBin = "" | .recycleBinCleanupDays = 7
                  | .setPermissionsLinux = false | .chownGroup = ""
                  | .skipFreeSpaceCheckWhenImporting = false | .minimumFreeSpaceWhenImporting = 100
                  | .createEmptySeriesFolders = false | .deleteEmptyFolders = false'
                # Sonarr refuses a root folder that does not exist yet.
                mkdir -p /data/media/tv
                ensure /rootfolder 'any(.[]; .path == "/data/media/tv")' '{"path":"/data/media/tv"}'
                provider downloadclient Sabnzbd SABnzbd '
                  {enable: true, protocol: "usenet", priority: 1, tags: [],
                   removeCompletedDownloads: true, removeFailedDownloads: true}' '
                  {host: "sabnzbd", port: 8080, useSsl: false, urlBase: "", apiKey: $ENV.SABNZBD_API_KEY,
                   tvCategory: "tv", recentTvPriority: -100, olderTvPriority: -100}'
                setting downloadclient '
                  .enableCompletedDownloadHandling = true | .autoRedownloadFailed = true
                  | .autoRedownloadFailedFromInteractiveSearch = true'
                # Saving the connection tests it, so a Plex that is off is skipped
                # rather than failing the release; the next upgrade retries.
                if ! curl -fs -o /dev/null "http://192.168.23.240:32400/identity"; then
                  echo "plex: unreachable, skipped"
                else
                # Plex sees the export at the same /data/media/tv path, so no path mapping.
                provider notification PlexServer Plex '
                  {tags: [], onDownload: true, onUpgrade: true, onImportComplete: true, onRename: true,
                   onSeriesAdd: true, onSeriesDelete: true, onEpisodeFileDelete: true,
                   onEpisodeFileDeleteForUpgrade: true}' '
                  {host: "192.168.23.240", port: 32400, useSsl: false, authToken: $ENV.PLEX_TOKEN,
                   updateLibrary: true}'
                fi
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # The NFS server is the Proxmox host that runs this worker, so media
      # traffic never leaves the host, and the config volume is created there.
      nodeSelector:
        kubernetes.io/hostname: "k8s-worker-4"
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          sonarr:
            app:
              - path: /config
      media:
        type: persistentVolumeClaim
        existingClaim: media
        advancedMounts:
          sonarr:
            app:
              - path: /data
          configure:
            app:
              - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
