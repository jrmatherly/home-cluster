---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: reactive-resume-db
spec:
  # Six fields, seconds first: 04:00 UTC every day.
  schedule: "0 0 4 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: reactive-resume-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
