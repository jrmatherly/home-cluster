---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactive-resume
spec:
  chartRef:
    kind: OCIRepository
    name: reactive-resume
  interval: 1h
  values:
    controllers:
      reactive-resume:
        annotations:
          reloader.stakater.com/auto: "true"
        # The app exits when its migrations cannot reach the database, so hold it
        # back until the database accepts connections.
        initContainers:
          wait-for-database:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command: ["sh", "-c", "until nc -z -w 2 reactive-resume-db-rw 5432; do sleep 2; done"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.0.2
            env:
              APP_URL: https://resume.${SECRET_DOMAIN}
              TRUSTED_PROXIES: "10.42.0.0/16"
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_CLIENT_ID: "9d6cb28f-6c94-45d1-a6ab-a664fdc989b7"
              OAUTH_DISCOVERY_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
              FLAG_DISABLE_EMAIL_AUTH: "true"
              S3_BUCKET: "reactive-resume"
              S3_REGION: auto
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: reactive-resume-db-app
                    key: uri
            envFrom:
              - secretRef:
                  name: reactive-resume-secret
            probes:
              # The probes ask for the page, not /api/health. That check writes to
              # the bucket inside a fixed 1.5 s limit, and the write has taken from
              # 0.3 s to over 20 s, so a slow bucket takes the only pod out of the
              # Service.
              # No liveness probe: a restart does not fix a database or bucket
              # outage.
              liveness:
                enabled: false
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - resume.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
