---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localai-models
data:
  # The KV cache costs 32 KiB per token on this model (8 of its 32 layers hold one), so
  # four slots of 16384 tokens are 2 GiB next to the 2.55 GiB weights on the 8 GiB card.
  # max_tokens is the answer length when a request sets none. AI Workspace sends none,
  # because this server's listing carries no context size, so 200 cut every chat reply
  # mid-sentence (measured 2026-10-12); 4096 leaves 12288 of a slot for the prompt.
  qwen-3.5-4b.yaml: |
    name: qwen-3.5-4b
    backend: llama-cpp
    parameters:
      model: qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repeat_penalty: 1.0
    context_size: 65536
    gpu_layers: 99999999
    cache_ram: 1024
    f16: true
    mmap: true
    reasoning_effort: none
    template:
      use_tokenizer_template: true
    options:
      - "use_jinja:true"
      - "parallel:4"
      - "kv_unified:false"
    function:
      grammar:
        disable: true
