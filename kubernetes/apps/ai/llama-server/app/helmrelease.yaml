---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-server
spec:
  chartRef:
    kind: OCIRepository
    name: llama-server
  interval: 1h
  # A node that has neither image cached pulls about 5 GB before the pod starts.
  timeout: 15m
  values:
    controllers:
      llama-server:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda-v0.5.0@sha256:52192a23c7b258044463aebba78826cdff39a7393b713edc313324b343a7b836
            env:
              LLAMA_ARG_MODEL: /models/Phi-4-mini-instruct-Q4_K_M.gguf
              LLAMA_ARG_ALIAS: phi-4-mini
              LLAMA_ARG_N_GPU_LAYERS: all
              # Four slots of 2048 tokens each.
              LLAMA_ARG_CTX_SIZE: 8192
              LLAMA_ARG_N_PARALLEL: 4
              # The default when a request sets no max_tokens. It is not a cap.
              LLAMA_ARG_N_PREDICT: 200
              LLAMA_ARG_PORT: 8080
              LLAMA_ARG_UI: false
            probes:
              # The first request with a prompt of realistic length takes about 9 s after
              # a model load, and a trivial one does not absorb that. This sends one, so
              # the pod is Ready only when it is warm.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - --output
                      - /dev/null
                      - --header
                      - "Content-Type: application/json"
                      - --data
                      - '{"max_tokens":8,"messages":[{"role":"system","content":"You are a concise assistant. Answer in two or three sentences."},{"role":"user","content":"In plain words, what does a reverse proxy do for a small web app, and when is it worth adding one in front of a single server?"}]}'
                      - http://localhost:8080/v1/chat/completions
                  periodSeconds: 5
                  timeoutSeconds: 20
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
    defaultPodOptions:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # The model is an image, built from images/phi-4-mini-instruct. The node keeps
      # it cached, so a restart needs neither a download nor Hugging Face.
      models:
        type: image
        image: ghcr.io/jrmatherly/models/phi-4-mini-instruct:q4_k_m-78eb92a@sha256:61b9c43d604f70404311af23afe16928a952c957a0237ef48de4e96719854beb
        globalMounts:
          - path: /models
            readOnly: true
