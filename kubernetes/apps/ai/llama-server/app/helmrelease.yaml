---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llama-server
spec:
  chartRef:
    kind: OCIRepository
    name: llama-server
  interval: 1h
  # The first start pulls a multi-gigabyte image and downloads the model.
  timeout: 15m
  values:
    controllers:
      llama-server:
        strategy: Recreate
        initContainers:
          model:
            image: &image
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda-v0.5.0@sha256:52192a23c7b258044463aebba78826cdff39a7393b713edc313324b343a7b836
            command: ["/bin/sh", "-ec"]
            # Pinned to a commit and checked against the file's sha256, so a
            # changed upstream file fails the pod instead of loading.
            args:
              - |-
                curl -fsSL --retry 3 -o /models/model.gguf \
                  https://huggingface.co/unsloth/Phi-4-mini-instruct-GGUF/resolve/78eb92a46fc37e6b524df991ed9aca9bc6aa7b80/Phi-4-mini-instruct-Q4_K_M.gguf
                echo "88c00229914083cd112853aab84ed51b87bdf6b9ce42f532d8c85c7c63b1730a  /models/model.gguf" | sha256sum -c
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            env:
              LLAMA_ARG_MODEL: /models/model.gguf
              LLAMA_ARG_ALIAS: phi-4-mini
              LLAMA_ARG_N_GPU_LAYERS: all
              # Four slots of 2048 tokens each.
              LLAMA_ARG_CTX_SIZE: 8192
              LLAMA_ARG_N_PARALLEL: 4
              # The default when a request sets no max_tokens. It is not a cap.
              LLAMA_ARG_N_PREDICT: 200
              LLAMA_ARG_PORT: 8080
              LLAMA_ARG_UI: false
            probes:
              # The first request with a prompt of realistic length takes about 9 s after
              # a model load, and a trivial one does not absorb that. This sends one, so
              # the pod is Ready only when it is warm.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - -fsS
                      - --output
                      - /dev/null
                      - --header
                      - "Content-Type: application/json"
                      - --data
                      - '{"max_tokens":8,"messages":[{"role":"system","content":"You are a concise assistant. Answer in two or three sentences."},{"role":"user","content":"In plain words, what does a reverse proxy do for a small web app, and when is it worth adding one in front of a single server?"}]}'
                      - http://localhost:8080/v1/chat/completions
                  periodSeconds: 5
                  timeoutSeconds: 20
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
    defaultPodOptions:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      models:
        type: emptyDir
        globalMounts:
          - path: /models
