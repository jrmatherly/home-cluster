---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flux-webhook-token
    creationPolicy: Owner
    template:
      data:
        token: "{{ .WEBHOOK_TOKEN }}"
  dataFrom:
    - extract:
        key: flux
