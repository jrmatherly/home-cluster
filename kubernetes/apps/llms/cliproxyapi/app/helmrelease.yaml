---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
spec:
  chartRef:
    kind: OCIRepository
    name: cliproxyapi
  interval: 1h
  values:
    controllers:
      cliproxyapi:
        # One volume, one writer.
        strategy: Recreate
        initContainers:
          # The app rewrites its config (the key's bcrypt hash, every UI change), so Git seeds it once and never overwrites it.
          seed-config:
            image: &image
              repository: eceasy/cli-proxy-api
              tag: v8.1.0@sha256:098ee6aaadf399f1812f3bba959c593182e3a44f5f1d28a8ec44b8c827ebd942
            command:
              - sh
              - -c
              - "[ -e /data/config.yaml ] || cp /seed/config.yaml /data/config.yaml"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            # The image has a Cmd and no Entrypoint, so args alone would replace the binary.
            command: ["/CLIProxyAPI/CLIProxyAPI", "--config", "/data/config.yaml"]
            env:
              # Plugins persist their state under ~/.cli-proxy-api; without HOME that is "/" and
              # read-only (claude-seat-pacer's history, measured 2026-11-07).
              HOME: /data
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8317
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # The image sets no USER, so without this the proxy runs as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      # config.yaml, the provider OAuth tokens and kv.db. The only copy.
      data:
        # The chart renames a lone claim when a second one appears.
        forceRename: cliproxyapi
        retain: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      # The plugin host unpacks each plugin under /tmp/cliproxy-pluginhost before loading it;
      # on the read-only root that mkdir failed and no plugin ran (measured 2026-11-07).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Only the init container sees the plaintext keys; the app keeps a hash.
      seed:
        type: secret
        name: cliproxyapi-secret
        advancedMounts:
          cliproxyapi:
            seed-config:
              - path: /seed
                readOnly: true
