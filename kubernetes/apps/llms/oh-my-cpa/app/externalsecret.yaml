---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oh-my-cpa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oh-my-cpa-secret
    creationPolicy: Owner
    template:
      data:
        OMCPA_CPA_MANAGEMENT_KEY: "{{ .MANAGEMENT_KEY }}"
        OMCPA_MASTER_KEY: "{{ .OHMYCPA_MASTER_KEY }}"
  dataFrom:
    - extract:
        key: cliproxyapi
