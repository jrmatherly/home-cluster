---
# Alertmanager's v2 API takes unauthenticated silences, so only this namespace
# reaches it. kubectl get --raw .../proxy arrives as the kube-apiserver entity,
# which needs admin credentials and which a NetworkPolicy cannot name. The kubelet's
# probes arrive as reserved:host, which Cilium always admits.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            # The cluster gossip uses both; one replica today, but a second must not be cut off.
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
    - fromEntities: ["kube-apiserver"]
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# Grafana and Radar query it, and FreeLens and kubectl get --raw .../proxy arrive as
# the kube-apiserver entity. The reloader sidecar is scraped on 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radar
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEntities: ["kube-apiserver"]
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# The gateway serves the UI, and Prometheus scrapes Grafana's own metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 3000
