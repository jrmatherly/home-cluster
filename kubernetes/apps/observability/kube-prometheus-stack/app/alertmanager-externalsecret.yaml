---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    creationPolicy: Owner
    template:
      data:
        discord-webhook: "{{ .DISCORD_WEBHOOK }}"
        heartbeat-url: "{{ .HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: observability
