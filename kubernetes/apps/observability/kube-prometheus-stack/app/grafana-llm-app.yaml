---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-llm-app
  labels:
    grafana_plugin: "1"
data:
  llm-app.yaml: |
    apiVersion: 1
    apps:
      - type: grafana-llm-app
        jsonData:
          # The OpenAI client against LocalAI; the key comes from Grafana's environment.
          provider: custom
          openAI:
            url: http://localai.ai.svc.cluster.local:8080
            apiPath: /v1
          # Both abstract models go to the one model LocalAI serves, named in its ConfigMap.
          models:
            default: base
            mapping:
              base: qwen-3.5-4b
              large: qwen-3.5-4b
        secureJsonData:
          openAIKey: $LOCALAI_API_KEY
