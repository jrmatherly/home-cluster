---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-kb
spec:
  chartRef:
    kind: OCIRepository
    name: ai-kb
  interval: 1h
  valuesFrom:
    # CloudNativePG generates this Secret.
    - kind: Secret
      name: ai-kb-db-app
      valuesKey: password
      targetPath: secrets.dbPassword
    # components/redis renders this Secret.
    - kind: Secret
      name: redis-auth
      valuesKey: password
      targetPath: secrets.redisPassword
    - kind: Secret
      name: ai-kb-secret
      valuesKey: values.yaml
  values:
    app:
      image:
        repository: ghcr.io/jrmatherly/ai-kb-app
        tag: v2026.10.21.1@sha256:9a461b8a116c01eab2041d3bb932caf1d5045721fbf69ecb5bc5258a7461eca8
      # The data-files volume is local-path, which one node mounts at a time.
      strategy:
        type: Recreate
      # The base of every docs link in the UI. The chart derives it only with its
      # own ingress on, which this cluster keeps off.
      docsUrl: https://ai-kb.${SECRET_DOMAIN}/docs/
      # The chart renders STORAGE_TYPE from env, so it is set here and not in
      # extraEnv, which would make a second variable of the same name.
      env:
        STORAGE_TYPE: s3
      # The app's builtin_models.yaml; BUILTIN_MODELS_CONFIG below names it.
      extraVolumes:
        - name: models-config
          configMap:
            name: ai-kb-models
      extraVolumeMounts:
        - name: models-config
          mountPath: /config/builtin_models.yaml
          subPath: builtin_models.yaml
          readOnly: true
      extraEnv:
        # invite_only: no password sign-up. New accounts come from a Pocket ID
        # sign-in or a system administrator; an invitation adds an existing
        # account to a workspace. Only with the Pocket ID client, because
        # without it nobody could create the first account. A registration
        # mode saved in the app's system settings overrides this.
        - name: DISABLE_REGISTRATION
          value: "true"
        - name: AIKB_IM_PLATFORMS
          value: slack,telegram,mattermost
        - name: AIKB_AUDIT_RETENTION_DAYS
          value: "365"
        - name: STORAGE_ALLOW_LIST
          value: local,s3,minio
        # Shows the links to the GitHub repository, which the app hides by default.
        - name: AIKB_GITHUB_LINK_ENABLED
          value: "true"
        # Promotes that account at startup while no system administrator
        # exists, so the first restart after that account exists makes it the admin.
        - name: AIKB_BOOTSTRAP_SYSTEM_ADMIN_EMAIL
          value: "jason@matherly.net"
        # The browser extension's OIDC sign-in returns to the store-assigned
        # extension origins (ai-kb extension/store/listing.md): Chrome Web
        # Store, then Edge Add-ons.
        - name: OIDC_AUTH_EXTENSION_RETURN_URLS
          value: https://beamnnjkmfepmlfpbcchiiooimoloiod.chromiumapp.org/oidc,https://eminfjejkcandcdbcjhdeobhhjidapdc.chromiumapp.org/oidc
        - name: OIDC_AUTH_ENABLE
          value: "true"
        - name: OIDC_AUTH_PROVIDER_DISPLAY_NAME
          value: Pocket ID
        - name: OIDC_AUTH_DISCOVERY_URL
          value: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
        - name: OIDC_AUTH_CLIENT_ID
          value: "be4ecf7a-6314-40e0-8a05-af6cc9602382"
        - name: OIDC_AUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: OIDC_AUTH_CLIENT_SECRET
        # The LocalAI models come from the ai-kb-models ConfigMap, mounted
        # above, with the key filled in from the env.
        - name: BUILTIN_MODELS_CONFIG
          value: /config/builtin_models.yaml
        - name: LOCALAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: LOCALAI_API_KEY
        # Uploads go to the app's RustFS bucket; the key pair is scoped to it.
        - name: S3_ENDPOINT
          value: http://rustfs-svc.rustfs.svc.cluster.local:9000
        - name: S3_REGION
          value: us-east-1
        - name: S3_BUCKET_NAME
          value: ai-kb-files
        - name: S3_FORCE_PATH_STYLE
          value: "true"
        - name: S3_USE_SSL
          value: "false"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: S3_SECRET_KEY
        # Tracing turns on when both keys are set and LANGFUSE_ENABLED is unset.
        # The exporter is the stock OTLP client, not the SSRF-safe one, so the
        # host needs no allowlist entry.
        - name: LANGFUSE_HOST
          value: http://langfuse-web.langfuse.svc.cluster.local:3000
        - name: LANGFUSE_ENVIRONMENT
          value: home
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-kb-secret
              key: LANGFUSE_SECRET_KEY
        # The app's SSRF guard refuses private addresses, which is what pods get
        # for the Pocket ID host (the internal gateway) and the LocalAI, RustFS
        # and SearXNG Services. The EXTRA list is always merged in; an admin's edit
        # of the SSRF allowlist in the app's settings replaces SSRF_WHITELIST.
        - name: SSRF_WHITELIST_EXTRA
          value: auth.${SECRET_DOMAIN},localai.ai.svc.cluster.local,rustfs-svc.rustfs.svc.cluster.local,searxng.ai-kb.svc.cluster.local
    frontend:
      image:
        repository: ghcr.io/jrmatherly/ai-kb-ui
        tag: v2026.10.21.1@sha256:384e9c7a0747703772befc3230b4246415defd42071c2a0b4c781eec562b15a6
    website:
      image:
        repository: ghcr.io/jrmatherly/ai-kb-website
        tag: v2026.10.21.1@sha256:aab6e36783e06cea9f0a0a88476cfdf976964a3d9fc7217a140d31d527d01435
    docreader:
      image:
        repository: ghcr.io/jrmatherly/ai-kb-docreader
        tag: v2026.10.21.1@sha256:e2d855e3582d9d4fd438ebd8a49efb6b533d519987b18042459ecd7102cf546f
    postgresql:
      enabled: false
    externalDatabase:
      host: ai-kb-db-rw
    redis:
      enabled: false
    externalRedis:
      addr: redis:6379
    # GraphRAG. The chart sets NEO4J_ENABLE and NEO4J_URI on the app, and the
    # password comes from ai-kb-secret's values document.
    neo4j:
      enabled: true
    secrets:
      dbUser: app
      dbName: app
  postRenderers:
    - kustomize:
        patches:
          # The chart's checksum covers its own Secret only; the app also reads
          # ai-kb-secret through secretKeyRef.
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ai-kb-app
                namespace: ai-kb
                annotations:
                  reloader.stakater.com/auto: "true"
