---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ai-kb-db
spec:
  # Each instance is pinned to a node by its local-path volume, so a second one
  # lets a node go down without taking the app with it.
  instances: 2
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql
    major: 18
  postgresql:
    shared_preload_libraries: ["pg_search"]
    # ParadeDB's extension image. Its Postgres major and Debian release must
    # match the catalog image, which already ships pgvector.
    extensions:
      - name: pg_search
        image:
          reference: docker.io/paradedb/paradedb-extension:0.26.2-18-trixie
        extension_control_path: ["share"]
        dynamic_library_path: ["lib"]
        ld_library_path: ["system"]
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  storage:
    storageClass: local-path
    size: 10Gi
