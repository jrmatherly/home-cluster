---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ai-kb-db
spec:
  # One instance, not the usual two: the community pg_search refuses to start
  # on a standby ("replicas are not supported on community and require
  # paradedb enterprise", measured 2026-10-17). WAL archiving and the daily
  # backup are the safety net.
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql
    major: 18
  # The app's migrations create these four extensions and later run
  # ALTER EXTENSION pg_search UPDATE, which only the owner may, so they are
  # created here and handed to the app role; a CNPG Database object cannot
  # set the owner. This runs once, at initdb, before the app can connect.
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - CREATE EXTENSION IF NOT EXISTS pg_search
        - UPDATE pg_extension SET extowner = 'app'::regrole WHERE extname IN ('uuid-ossp', 'vector', 'pg_trgm', 'pg_search')
  postgresql:
    shared_preload_libraries: ["pg_search"]
    # ParadeDB's extension image. Its Postgres major and Debian release must
    # match the catalog image, which already ships pgvector.
    extensions:
      - name: pg_search
        image:
          reference: docker.io/paradedb/paradedb-extension:0.26.4-18-trixie
        extension_control_path: ["share"]
        dynamic_library_path: ["lib"]
        ld_library_path: ["system"]
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  storage:
    storageClass: local-path
    size: 10Gi
