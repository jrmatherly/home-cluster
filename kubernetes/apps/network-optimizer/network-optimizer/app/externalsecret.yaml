---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-optimizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: network-optimizer-secret
    creationPolicy: Owner
    template:
      data:
        APP_PASSWORD: "{{ .APP_PASSWORD }}"
        NETOPT_FED_POCKET_ID_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: network-optimizer
