---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: network-optimizer
spec:
  hostnames: ["optimizer.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: network-optimizer
          port: 8042
