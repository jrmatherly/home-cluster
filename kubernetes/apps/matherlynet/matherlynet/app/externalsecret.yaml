---
# The secrets are a whole values document because Flux splits a targetPath
# value on commas. The two addresses are here to keep them out of Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matherlynet
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: matherlynet-secret
    creationPolicy: Owner
    template:
      data:
        values.yaml: |
          config:
            web:
              admin_email: "{{ .ADMIN_EMAIL }}"
              mail_from: "{{ .MAIL_FROM }}"
          secrets:
            web:
              better_auth_secret: "{{ .BETTER_AUTH_SECRET }}"
              playground_model_key: "{{ .LOCALAI_API_KEY }}"
              smtp_url: "{{ .SMTP_URL }}"
              github_client_secret: "{{ .GITHUB_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: matherlynet
  data:
    - secretKey: LOCALAI_API_KEY
      remoteRef:
        key: localai
        property: API_KEY
