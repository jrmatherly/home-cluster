---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matherlynet
spec:
  chartRef:
    kind: OCIRepository
    name: matherlynet
  interval: 1h
  valuesFrom:
    # CloudNativePG generates this Secret. uri is the connection string for the
    # read-write Service.
    - kind: Secret
      name: matherlynet-db-app
      valuesKey: uri
      targetPath: secrets.web.appdb_uri
    - kind: Secret
      name: matherlynet-secret
      valuesKey: values.yaml
  values:
    config:
      web:
        # The site is the domain's apex and accepts auth requests for this
        # origin only.
        app_url: https://${SECRET_DOMAIN}
        github_client_id: "Ov23liFvUQasJxSSmNmM"
        # The base URL, without /v1.
        playground_model_url: http://llama-server.ai.svc.cluster.local:8080
  # The chart cannot set a securityContext, resources or annotations, and the
  # namespace enforces the restricted pod security level. runAsUser is set
  # because the image's user is a name (node), which the kubelet cannot verify
  # as non-root. The pod reads its config through envFrom, so Reloader restarts
  # it when the ConfigMap or Secret changes.
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-deployment
                annotations:
                  reloader.stakater.com/auto: "true"
              spec:
                template:
                  spec:
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile: { type: RuntimeDefault }
                    containers:
                      - name: web
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities: { drop: ["ALL"] }
                        resources:
                          requests: { cpu: 100m, memory: 384Mi }
                          limits: { memory: 768Mi }
