---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
  interval: 1h
  values:
    fullnameOverride: local-path-provisioner
    helperImage:
      repository: docker.io/library/busybox
      tag: 1.38.0
    # The Talos user volume in talos/all/72-volumes.yaml.
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /var/mnt/local-path
    storageClass:
      defaultClass: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
