---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs
spec:
  interval: 1h
  path: ./kubernetes/apps/storage/csi-driver-nfs/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  # media-shared depends on this, so the driver is ready before the share mounts.
  wait: true
