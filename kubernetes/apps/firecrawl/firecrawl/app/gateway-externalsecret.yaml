---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-gateway-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: firecrawl-gateway-keys
    creationPolicy: Owner
    template:
      data:
        # One key per client ID. The value is the bare key, without `Bearer`.
        lan: "{{ .GATEWAY_API_KEY }}"
  dataFrom:
    - extract:
        key: firecrawl
