---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pegaprox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pegaprox-secret
    creationPolicy: Owner
    template:
      data:
        PEGAPROX_DB_KEY: "{{ .DB_KEY }}"
  dataFrom:
    - extract:
        key: pegaprox
