---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./metrics-secret.sops.yaml
configMapGenerator:
  - name: pegaprox-dashboard
    files:
      - dashboards/pegaprox-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
