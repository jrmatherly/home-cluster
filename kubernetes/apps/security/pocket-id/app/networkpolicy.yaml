---
# Pocket ID trusts X-Forwarded-For from the whole pod CIDR (TRUST_PROXY), so only
# the gateway may reach it. In-cluster callers resolve auth.${SECRET_DOMAIN} to the
# gateway through the CoreDNS hosts entry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/controller: pocket-id
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 1411
