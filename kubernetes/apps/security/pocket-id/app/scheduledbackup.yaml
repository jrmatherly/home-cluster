---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pocket-id-db
spec:
  # Six fields, seconds first: 03:00 UTC every day.
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: pocket-id-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
