---
# The domain every app Kustomization substitutes, one copy per namespace. It is
# here and not in a component, because cluster-apps must never apply an ESO kind.
# Orphan, so removing this object can never delete the copies.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  refreshTime: 1h
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - cilium-secrets
            - external-secrets
            - kube-node-lease
            - kube-public
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      name: cluster-secrets
      creationPolicy: Orphan
      template:
        data:
          SECRET_DOMAIN: "{{ .SECRET_DOMAIN }}"
    dataFrom:
      - extract:
          key: cluster
