---
# Orphan: ESO rewrites the two Secrets Connect starts from, so a rotation in
# 1Password reaches the cluster, but never owns them, so nothing can
# garbage-collect them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connect-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-connect-credentials
    creationPolicy: Orphan
    template:
      data:
        1password-credentials.json: "{{ .OP_CREDENTIALS_JSON }}"
  dataFrom:
    - extract:
        key: 1password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connect-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-connect-token
    creationPolicy: Orphan
    template:
      data:
        token: "{{ .OP_CONNECT_TOKEN }}"
  dataFrom:
    - extract:
        key: 1password
