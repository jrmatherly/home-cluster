---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  chartRef:
    kind: OCIRepository
    name: langfuse
  interval: 1h
  timeout: 15m
  values:
    langfuse:
      salt:
        secretKeyRef: { name: langfuse-secret, key: SALT }
      encryptionKey:
        secretKeyRef: { name: langfuse-secret, key: ENCRYPTION_KEY }
      nextauth:
        url: https://langfuse.${SECRET_DOMAIN}
        secret:
          secretKeyRef: { name: langfuse-secret, key: NEXTAUTH_SECRET }
      # Sign-up stays on, because turning it off also refuses a first Pocket ID
      # sign-in; the Pocket ID client decides who gets in.
      auth:
        disableUsernamePassword: true
        providers:
          custom:
            clientId: "3d8a79bb-e8d7-4fcb-a091-39afb6c5f2e9"
            clientSecret:
              secretKeyRef: { name: langfuse-secret, key: AUTH_CUSTOM_CLIENT_SECRET }
            issuer: https://auth.${SECRET_DOMAIN}
            name: Pocket ID
      features:
        telemetryEnabled: false
      # The chart adds this list to both web and worker; the worker runs evaluators.
      # Self-hosted Langfuse refuses an LLM connection to a private address otherwise.
      additionalEnv:
        - name: LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST
          value: localai.ai.svc.cluster.local
      serviceAccount:
        automountServiceAccountToken: false
      # The chart puts no checksum of langfuse-secret on its pod templates.
      deployment:
        annotations:
          reloader.stakater.com/auto: "true"
      # The chart defaults to Always; the digest pins make IfNotPresent safe.
      image:
        pullPolicy: IfNotPresent
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      web:
        image:
          repository: docker.io/langfuse/langfuse
          tag: 4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
        pod:
          additionalEnv:
            - name: LANGFUSE_DEFAULT_ORG_ID
              value: home
            # Applied to every new user; OWNER could delete the organization.
            - name: LANGFUSE_DEFAULT_ORG_ROLE
              value: ADMIN
            # The sign-up onboarding step calls langfuse.com from the browser.
            - name: LANGFUSE_DISABLE_SIGNUP_ONBOARDING
              value: "true"
            # Created on the first start only, when absent.
            - name: LANGFUSE_INIT_ORG_ID
              value: home
            - name: LANGFUSE_INIT_ORG_NAME
              value: Home
            - name: LANGFUSE_INIT_PROJECT_ID
              value: ai-kb
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: AI KB
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: langfuse-secret, key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY }
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: langfuse-secret, key: LANGFUSE_INIT_PROJECT_SECRET_KEY }
        resources:
          requests: { memory: 512Mi }
          limits: { memory: 2Gi }
        pdb:
          create: false
      worker:
        image:
          repository: docker.io/langfuse/langfuse-worker
          tag: 4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
        resources:
          requests: { memory: 512Mi }
          limits: { memory: 2Gi }
        pdb:
          create: false
    postgresql:
      deploy: false
      host: langfuse-db-rw
      auth:
        username: app
        database: app
        existingSecret: langfuse-db-app
    redis:
      deploy: false
      host: redis
      auth:
        existingSecret: redis-auth
        existingSecretPasswordKey: password
    clickhouse:
      deploy: false
      host: clickhouse
      auth:
        username: langfuse
        existingSecret: clickhouse-auth
        existingSecretKey: password
      cluster:
        enabled: false
    s3:
      deploy: false
      bucket: langfuse-events
      region: us-east-1
      endpoint: http://rustfs-svc.rustfs.svc.cluster.local:9000
      accessKeyId:
        secretKeyRef: { name: langfuse-secret, key: S3_ACCESS_KEY }
      secretAccessKey:
        secretKeyRef: { name: langfuse-secret, key: S3_SECRET_KEY }
      batchExport:
        enabled: false
      # The chart renders the media settings whatever this says, and Langfuse has no
      # switch to turn media upload off, so any media lands under its own prefix.
      mediaUpload:
        enabled: false
        prefix: media/
  postRenderers:
    - kustomize:
        patches:
          # The web container runs every migration before it listens, over 450 on
          # a fresh install, and the chart's probes kill it part way (langfuse-k8s
          # issues 272 and 427), which leaves a failed migration behind.
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: langfuse-web
                namespace: langfuse
              spec:
                template:
                  spec:
                    enableServiceLinks: false
                    containers:
                      - name: langfuse-web
                        startupProbe:
                          httpGet:
                            path: /api/public/health
                            port: http
                          periodSeconds: 10
                          failureThreshold: 60
                        volumeMounts:
                          - name: next-cache
                            mountPath: /app/web/.next/cache
                    volumes:
                      - name: next-cache
                        emptyDir: {}
          # The namespace's redis and clickhouse Services make the kubelet inject
          # REDIS_PORT=tcp://... into every pod, which Langfuse parses as a number
          # and refuses to start (measured 2026-10-18); the chart has no switch.
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: langfuse-worker
                namespace: langfuse
              spec:
                template:
                  spec:
                    enableServiceLinks: false
