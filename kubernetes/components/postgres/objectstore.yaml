---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup
spec:
  retentionPolicy: 30d
  configuration:
    # Each cluster writes under its own name, so Cluster names must be unique across namespaces.
    destinationPath: s3://home-cluster-pg/
    endpointURL: https://0d81a943ce00a742bb95d0861f4ad6c6.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: postgres-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
