[project]
name = "cluster-template"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["makejinja==2.9.1", "pydantic==2.13.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's default rule set, plus import sorting.
extend-select = ["I"]

[tool.ruff.format]
# plugin.py uses single quotes and the other files use double.
quote-style = "preserve"

[tool.pyrefly]
# The scripts import each other as top-level modules (makejinja loads plugin.py by path).
search-path = ["template/scripts"]
