[pre-commit]
parallel = true
skip = ["merge", "rebase"]

[pre-commit.commands.format-just]
glob = ["justfile", "*.just", ".justfile"]
run = 'for f in {staged_files}; do just --justfile "$f" --fmt; done'
stage_fixed = true

[pre-commit.commands.format-mise]
glob = [".mise.toml", ".mise/config.toml", ".mise/conf.d/*.toml"]
run = "mise fmt"
stage_fixed = true

[pre-commit.commands.format-json]
glob = ["*.json", "*.json5", "*.jsonc"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-markdown]
glob = ["*.md", "*.markdown"]
# oxfmt exits 2 when every named file is ignored, so keep the Nimbus starter file out of the list.
exclude = ["docs/AGENT.md"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-yaml]
glob = ["*.yaml", "*.yml"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.format-toml]
glob = ["*.toml"]
# format-mise owns .mise/; oxfmt ignores it and exits 2 when every named file is ignored.
exclude = [".mise/**"]
run = "oxfmt {staged_files}"
stage_fixed = true

[pre-commit.commands.cluster-guard]
glob = [".claude/skills/cluster-guard/**/*"]
run = "claude plugin test .claude/skills/cluster-guard"

[pre-commit.commands.scrub-docs]
glob = ["docs/src/content/**/*"]
run = "docs/scrub-check.sh {staged_files}"

[pre-commit.commands.mise-lock]
glob = [".mise.toml", ".mise/config.toml", ".mise/conf.d/*.toml"]
run = "mise lock && git add .mise/mise.lock"

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml"]
run = "zizmor --offline {staged_files}"

[pre-commit.commands.ruff]
glob = ["*.py"]
run = "uv run --locked ruff format {staged_files} && uv run --locked ruff check {staged_files}"
stage_fixed = true

[pre-commit.commands.shellcheck]
glob = ["*.sh"]
run = "shellcheck {staged_files}"

[pre-commit.commands.markdownlint]
glob = ["*.md"]
run = "markdownlint-cli2"
