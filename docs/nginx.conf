# Serves the docs site's static build (dist/).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The agent-facing endpoints (/<page>/index.md, /<page>/index.mdx) need real
  # media types; nginx's mime.types knows neither .md nor .mdx.
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
    text/mdx      mdx;
  }
  charset utf-8;
  # nginx's default charset_types (text/html is always included), plus the markdown types.
  charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown text/mdx;

  # Compress text responses here: an ingress in front may not (text/html is always included).
  gzip on;
  gzip_vary on;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml text/markdown text/mdx;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Astro fingerprints everything under /_astro/, so it can be cached forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Pages revalidate on every visit, so a redeploy shows at once instead of
  # stale HTML pointing at /_astro/ files the new image no longer has.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
