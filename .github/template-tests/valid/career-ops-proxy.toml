# A [career_ops] section carrying the CLIProxyAPI pair in place of claude_oauth_token,
# so the proxy branches of the career-ops Secret, HelmRelease env and the proxy's
# NetworkPolicy render in a fixture.

[network]
node_cidr = "10.10.10.0/24"
default_gateway = "10.10.10.1"
vlan_tag = "100"
dns_servers = ["1.1.1.1"]
ntp_servers = ["162.159.200.123"]

[kubernetes]
pod_cidr = "10.42.0.0/16"
svc_cidr = "10.43.0.0/16"

[kubernetes.api]
addr = "10.10.10.254"
tls_sans = ["example.com"]

[gateways]
internal = "10.10.10.252"
dns = "10.10.10.253"
external = "10.10.10.251"

[repository]
url = "https://github.com/onedr0p/cluster-template.git"
branch = "main"

[onepassword]
vault = "homelab"

[domain]
name = "example.com"

[dns]

[ingress]
tunnel_id = "fake"

[talos]
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"

[postgres.backup]
endpoint = "https://fake.r2.cloudflarestorage.com"
bucket = "fake"

[volume_backup]
enabled = true

[pocket_id]
enabled = true
public = true

[redis]
enabled = true

[cliproxyapi]
enabled = true
ohmycpa = true
github = true

[career_ops]
oidc_client_id = "fake-career-ops"
enabled = true
claude_credential = "proxy"
anthropic_base_url = "http://cliproxyapi.llms.svc.cluster.local:8317"
publish_oidc_client_id = "fake-publish"

[firecrawl]
enabled = true
model = "claude-haiku-5-5"

[[nodes]]
name = "k8s-0"
address = "10.10.10.100"
controller = true
disk = "/dev/sdfake"
mac_addr = "00:00:00:00:00:00"

[[nodes]]
name = "k8s-1"
address = "10.10.10.101"
controller = false
disk = "/dev/sdfake"
mac_addr = "00:00:00:00:00:01"
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
mtu = 1500
secureboot = true
encrypt_disk = true
