---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Update Apps"

on:
  schedule:
    # Monday 13:00 UTC, after Renovate's weekend window, so a tier 1 merge never lands under the run.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the action per PR and touch nothing
        type: boolean
        default: true

concurrency:
  group: update-apps
  cancel-in-progress: false

permissions: {}

jobs:
  research:
    name: Research
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dry_run: ${{ inputs.dry_run || vars.UPDATE_APPS_LIVE != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Research the open Renovate PRs
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            /update-apps --auto

            The checkout is fresh, so skip `git pull`. This run cannot write files. Return the verdict
            array as `verdicts` and the auto-run report from `templates/report.md` as `report` in the
            structured output. The workflow writes verdicts.json and the step summary from them.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh release view *),Bash(gh release list *),WebFetch(domain:github.com),WebFetch(domain:api.github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:ghcr.io),WebFetch(domain:quay.io),WebFetch(domain:registry-1.docker.io),WebFetch(domain:hub.docker.com),WebFetch(domain:docs.cilium.io),WebFetch(domain:codeberg.org),WebFetch(domain:charts.rustfs.com),Bash(git log *),Bash(git show *)"
            --json-schema '{"type":"object","required":["verdicts","report"],"properties":{"report":{"type":"string"},"verdicts":{"type":"array","items":{"type":"object","required":["pr","app","namespace","kind","from","to","bump","headRefOid","verdict","evidence"],"properties":{"pr":{"type":"integer"},"app":{"type":"string"},"namespace":{"type":"string"},"kind":{"enum":["chart","image"]},"from":{"type":"string"},"to":{"type":"string"},"bump":{"type":"string"},"headRefOid":{"type":"string"},"verdict":{"enum":["safe","needs template change","blocked","not ours"]},"evidence":{"type":"string"}}}}}}'

      - name: Write the verdicts and the report
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          mkdir -p "$RUNNER_TEMP/research"
          jq -e '.verdicts' <<<"$OUTPUT" >"$RUNNER_TEMP/research/verdicts.json"
          jq -er '.report' <<<"$OUTPUT" | tee "$RUNNER_TEMP/research/report.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the research
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research
          path: ${{ runner.temp }}/research/

  apply:
    # Never on a pull_request event, so no PR code ever runs on the in-cluster runner.
    if: github.event_name != 'pull_request'
    name: Apply
    needs: research
    runs-on: home-cluster
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script pushes a revert, and no model runs in this job.
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # mise's [env] points KUBECONFIG at a file the runner lacks; unset, kubectl uses the pod's
          # ServiceAccount.
          env: false
          install_args: flux2 gh jq kubectl lefthook yq github:home-operations/flate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check the tree and the cluster access
        run: |
          git checkout -- .mise/mise.lock
          git status --short
          test -z "$(git status --short)"
          echo "KUBECONFIG=${KUBECONFIG-unset}, kubectl at $(command -v kubectl)"
          kubectl get ns
          if kubectl auth can-i list secrets --all-namespaces; then
            echo "::error::the runner can read Secrets"
            exit 1
          fi

      - name: Download the research
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research
          path: ${{ runner.temp }}/research

      - name: Merge the safe PRs
        env:
          CLUSTER_DOMAIN: ${{ secrets.CLUSTER_DOMAIN }}
          DRY_RUN: ${{ needs.research.outputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=()
          [[ "$DRY_RUN" == true ]] && flag=(--dry-run)
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          .claude/skills/update-apps/scripts/auto-merge.sh "$RUNNER_TEMP/research/verdicts.json" "${flag[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
