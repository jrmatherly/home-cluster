---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Update Apps"

on:
  schedule:
    # Monday 13:00 UTC, after Renovate's weekend window, so a tier 1 merge never lands under the run.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the action per PR and touch nothing
        type: boolean
        default: true

concurrency:
  group: update-apps
  cancel-in-progress: false

permissions: {}

jobs:
  research:
    name: Research
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dry_run: ${{ inputs.dry_run || vars.UPDATE_APPS_LIVE != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lock the research scripts
        # The allowlist below runs two repo scripts by relative path. Read-only files mean no allowed
        # command, redirection or flag can rewrite them before they run.
        run: |
          chmod -R a-w .claude/skills/update-apps/scripts .claude/skills/update-apps/references
          test ! -w .claude/skills/update-apps/scripts/upstream-diff.sh

      - name: Install the subprocess sandbox
        # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB requires it: without socat and bubblewrap Bash will not
        # start (measured 2026-11-01). The action installs them only with allowed_non_write_users.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -e -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Research the open Renovate PRs
        id: claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            /update-apps --auto

            The checkout is fresh, so skip `git pull`. This run writes nothing under the checkout; scratch
            files go under $RUNNER_TEMP. Run every research subagent in the foreground and return only
            when each PR has a verdict with its research done; a verdict is never "unresearched". Return
            the verdict array as `verdicts` and the auto-run report from `templates/report.md` as `report`
            in the structured output. The workflow writes verdicts.json and the step summary from them.
            `from` and `to` are the version alone, with no digest, or `various` for a group with no single
            version, and `evidence` stays under 800 characters.
          # The Bash prefixes are the read-only commands a research run makes (measured in a local headless
          # run). Anything that reaches the network or can run a command goes through a repo script with
          # fixed arguments: compare-chart.sh (helm) and upstream-diff.sh (a shallow clone and git diff with
          # no external diff or pager). curl, wget, interpreters, find, tar, sed, cat (Read covers it), raw
          # git fetch and clone, gh api, cd, yq (it writes with -i) and every other network tool stay
          # denied, git's --output is denied by name, and GH_HOST pins gh to github.com, so a
          # prompt-injected run has nothing that can run a command or send the OAuth token or the
          # read-only GitHub token anywhere, and WebFetch is limited to the hosts the research reads.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --disallowedTools "Bash(git * --output*),Bash(git * -o *),Read(//proc/**)"
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh release view *),Bash(gh release list *),Bash(.claude/skills/update-apps/scripts/compare-chart.sh *),Bash(.claude/skills/update-apps/scripts/upstream-diff.sh *),Bash(git log *),Bash(git show *),Bash(git diff *),Bash(grep *),Bash(ls *),Bash(wc *),Bash(diff *),Bash(jq *),WebFetch(domain:github.com),WebFetch(domain:api.github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:ghcr.io),WebFetch(domain:quay.io),WebFetch(domain:registry-1.docker.io),WebFetch(domain:hub.docker.com),WebFetch(domain:docs.cilium.io),WebFetch(domain:codeberg.org),WebFetch(domain:charts.rustfs.com)"
            --json-schema '{"type":"object","required":["verdicts","report"],"properties":{"report":{"type":"string"},"verdicts":{"type":"array","items":{"type":"object","required":["pr","app","namespace","kind","from","to","bump","headRefOid","verdict","evidence"],"properties":{"pr":{"type":"integer"},"app":{"type":"string","pattern":"^[a-z0-9-]+$"},"namespace":{"type":"string","pattern":"^[a-z0-9-]*$"},"kind":{"enum":["chart","image"]},"from":{"type":"string","pattern":"^[A-Za-z0-9._+-]{1,64}$"},"to":{"type":"string","pattern":"^[A-Za-z0-9._+-]{1,64}$"},"bump":{"type":"string","pattern":"^[a-z]{1,16}$"},"headRefOid":{"type":"string","pattern":"^[0-9a-f]{40}$"},"verdict":{"enum":["safe","needs template change","blocked","not ours"]},"evidence":{"type":"string","maxLength":799}}}}}}'
        env:
          GH_HOST: github.com
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

      - name: Refuse output that could carry a token
        # The primary control: the scrub and the sandbox cover subprocesses only, and the Read tool runs
        # in the Claude Code process itself.
        shell: bash
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if ! jq -e -f .claude/skills/update-apps/scripts/research-guard.jq <<<"$OUTPUT" >/dev/null; then
            echo "The research output failed the token guard, so nothing was published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Write the verdicts and the report
        shell: bash
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          mkdir -p "$RUNNER_TEMP/research"
          jq -e '.verdicts' <<<"$OUTPUT" >"$RUNNER_TEMP/research/verdicts.json"
          jq -er '.report' <<<"$OUTPUT" | tee "$RUNNER_TEMP/research/report.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the research
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research
          path: ${{ runner.temp }}/research/

  apply:
    # Never on a pull_request event, so no PR code ever runs on the in-cluster runner.
    if: github.event_name != 'pull_request'
    name: Apply
    needs: research
    runs-on: home-cluster
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script pushes a revert, and no model runs in this job.
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # mise's [env] points KUBECONFIG at a file the runner lacks; unset, kubectl uses the pod's
          # ServiceAccount.
          env: false
          install_args: flux2 gh jq kubectl lefthook yq github:home-operations/flate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check the tree and the cluster access
        run: |
          git checkout -- .mise/mise.lock
          git status --short
          test -z "$(git status --short)"
          echo "KUBECONFIG=${KUBECONFIG-unset}, kubectl at $(command -v kubectl)"
          kubectl get ns
          if kubectl auth can-i list secrets --all-namespaces; then
            echo "::error::the runner can read Secrets"
            exit 1
          fi

      - name: Download the research
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research
          path: ${{ runner.temp }}/research

      - name: Merge the safe PRs
        shell: bash
        env:
          CLUSTER_DOMAIN: ${{ secrets.CLUSTER_DOMAIN }}
          DRY_RUN: ${{ needs.research.outputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=()
          [[ "$DRY_RUN" == true ]] && flag=(--dry-run)
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          .claude/skills/update-apps/scripts/auto-merge.sh "$RUNNER_TEMP/research/verdicts.json" "${flag[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
