#:schema ./cluster.schema.json
# =============================================================================
#    Physical LAN that your Talos nodes live on. Defines the address space
#    used for node IPs, the gateway/DNS/NTP servers nodes will use, and an
#    optional VLAN tag for switch ports that aren't natively tagged.
# =============================================================================
[network]

# The CIDR block your nodes' IPs come from. Every node's `address`, the Kube
# API VIP, and the gateway VIPs (internal/dns/external) must all sit inside
# this range (the gateway VIPs may sit outside it when [cilium.bgp] is set).
# REQUIRED. Example: "192.168.1.0/24"
node_cidr = ""

# Upstream DNS servers Talos nodes use for name resolution. Defaults to
# Cloudflare (1.1.1.1 / 1.0.0.1). Override if you run an internal resolver
# (Pi-hole, Unbound, AdGuard) or want a different public provider.
# OPTIONAL. Default: ["1.1.1.1", "1.0.0.1"]

# dns_servers = ["1.1.1.1", "1.0.0.1"]

# Upstream NTP servers. Defaults to Cloudflare's anycast NTP. Most homelabs
# don't need to change this.
# OPTIONAL. Default: ["162.159.200.1", "162.159.200.123"]

# ntp_servers = ["162.159.200.1", "162.159.200.123"]

# Default gateway IP that nodes use to reach the rest of your LAN/WAN.
# Defaults to the first usable host in node_cidr (e.g. 192.168.1.1 for
# 192.168.1.0/24), which is correct for most home routers. Override if your
# router lives at a non-standard address inside the subnet.
# OPTIONAL. Default: first IP in node_cidr

# default_gateway = ""

# 802.1Q VLAN tag to apply to the Talos node interface. Only set this if
# your switch ports are configured as trunks (passing tagged traffic to the
# nodes); access ports already untag VLAN traffic. Must be 1-4094.
# REF: https://www.talos.dev/latest/advanced/advanced-networking/#vlans
# OPTIONAL.

# vlan_tag = ""


# =============================================================================
#    Cluster-internal control plane and overlay networks. The pod and service
#    CIDRs are in-cluster only — they don't have to be routable on your LAN
#    and never appear on the wire outside the nodes.
# =============================================================================
[kubernetes]

# CIDR Cilium hands out to pods. /16 gives ~64K pod IPs, which is well beyond
# what a homelab needs but matches the upstream default. Must NOT overlap
# with node_cidr or svc_cidr.
# OPTIONAL. Default: "10.42.0.0/16"

# pod_cidr = "10.42.0.0/16"

# CIDR for ClusterIP services (the virtual IPs `kubectl get svc` shows).
# Same /16 reasoning as pod_cidr. Must NOT overlap with node_cidr or
# pod_cidr.
# OPTIONAL. Default: "10.43.0.0/16"

# svc_cidr = "10.43.0.0/16"

# ClusterIP for the CoreDNS Service. Must be inside svc_cidr.
# OPTIONAL. Default: the 10th IP in svc_cidr

# coredns_addr = ""

[kubernetes.api]

# Virtual IP for the Kubernetes API server. kubectl, flux, and every other
# client connect here on port 6443. Must be an unused IP inside
# network.node_cidr; Talos floats it across controller nodes as a Layer 2 VIP.
# REQUIRED.
addr = ""

# Additional Subject Alternative Names to put on the Kube API cert. Useful
# if you want to call the API by hostname (e.g. via a CNAME or local
# /etc/hosts entry) instead of the raw IP.
# OPTIONAL. Example: ["mycluster.example.com"]

# tls_sans = ["mycluster.example.com"]


# =============================================================================
#    LoadBalancer IPs that Cilium hands out to the cluster's edge gateways.
#    Each must be an unused address inside network.node_cidr (unless
#    [cilium.bgp] is set), and all four (these three plus kubernetes.api.addr)
#    must be distinct.
# =============================================================================
[gateways]

# IP for the `envoy-internal` gateway — used by HTTPRoutes intended for
# private/in-network access only. Most apps use this gateway by default.
# REQUIRED.
internal = ""

# IP for `k8s_gateway`, which serves DNS for cluster-managed hostnames.
# Point your home DNS server's conditional forwarder for domain.name
# at this IP to enable split-DNS resolution from your LAN.
# REQUIRED.
dns = ""

# IP for the `envoy-external` gateway — sits behind the ingress path (e.g.
# the cloudflared tunnel) and handles traffic exposed to the public
# internet. HTTPRoutes that reference this gateway become reachable via
# your public domain.
# REQUIRED unless ingress.mode is "none" (internal-only cluster).
external = ""


# =============================================================================
#    The Git repo Flux will sync from. This is the single source of truth
#    for everything in your cluster — once bootstrapped, changes are made by
#    pushing to this repo. Any Git host works: GitHub, GitLab, Gitea,
#    Forgejo, Codeberg or self-hosted.
# =============================================================================
[repository]

# Full clone URL of the repository this cluster will pull from.
# Must be the repo you cloned this template into.
# Use `https://` if the repo is publicly readable (or `http://` for a
# LAN-local git server). Use `ssh://git@` if it is
# private: the template then wires up a deploy key (`deploy.key.pub`) so
# Flux can clone over SSH; see the README for the extra setup step.
# REQUIRED. Examples:
#   "https://github.com/onedr0p/home-ops.git"
#   "ssh://git@gitlab.com/onedr0p/home-ops.git"
#   "ssh://git@git.example.com/k8s/home-ops.git"
url = ""

# Branch Flux watches. Changes pushed to this branch get reconciled into the
# cluster.
# OPTIONAL. Default: "main"

# branch = "main"

# Webhook payload format the Flux webhook Receiver verifies, so pushes are
# reconciled instantly. Gitea and Forgejo emulate GitHub webhooks, so keep
# "github" for them. Use "generic-hmac" for anything else that signs with
# HMAC; see https://fluxcd.io/flux/components/notification/receivers/
# Use "none" to skip the webhook entirely (e.g. your Git host cannot reach
# the cluster); Flux then only polls on an interval.
# OPTIONAL. Default: "github".
# Allowed: "github" | "gitlab" | "generic-hmac" | "none"

# webhook_provider = "github"

# SSH host keys for your Git host (`ssh-keyscan -t ed25519,ecdsa,rsa <host>`
# output). Only used with `ssh://` URLs. Keys for github.com, gitlab.com and
# codeberg.org are bundled; REQUIRED for any other host.
# OPTIONAL. Example:
#   known_hosts = """
#   git.example.com ssh-ed25519 AAAA...
#   """

# known_hosts = ""


# =============================================================================
#    The domain your cluster's hostnames live under. Used for every rendered
#    hostname (echo, flux-webhook, internal split DNS) and the wildcard
#    certificate, regardless of DNS provider.
# =============================================================================
[domain]

# REQUIRED. Example: "example.com"
name = ""


# =============================================================================
#    Public DNS authority and certificate issuance. With "cloudflare",
#    external-dns publishes records automatically and cert-manager issues a
#    Let's Encrypt wildcard via ACME DNS-01. With "none", nothing is
#    published and the wildcard certificate is issued by an in-cluster
#    self-signed CA instead (internal-only cluster).
# =============================================================================
[dns]

# OPTIONAL. Default: "cloudflare". Allowed: "cloudflare" | "none"

# provider = "cloudflare"

# Cloudflare API token (NOT the global API key) with `Zone - DNS - Edit` and
# `Account - Cloudflare Tunnel - Read` permissions, scoped to the zone
# above. See the README for token creation steps.
# REQUIRED when provider is "cloudflare"; must be empty otherwise.
token = ""


# =============================================================================
#    How the public internet reaches the cluster's external gateway. With
#    "cloudflare-tunnel", cloudflared connects outbound so no ports are
#    forwarded (requires dns.provider = "cloudflare" and
#    cloudflare-tunnel.json). With "direct", you forward TCP 443 (and
#    optionally 80) on your router to gateways.external and point an
#    `external.<domain>` DNS record at your WAN address (A record or DDNS
#    CNAME) yourself; per-app records are still published automatically.
#    With "none", nothing is exposed and apps are only reachable on your
#    LAN via the internal gateway.
# =============================================================================
[ingress]

# OPTIONAL. Default: "cloudflare-tunnel" when dns.provider is "cloudflare",
# otherwise "none". Allowed: "cloudflare-tunnel" | "direct" | "none"

# mode = "cloudflare-tunnel"


# =============================================================================
#    CNI configuration. Defaults are sane for most homelab setups; touch
#    this section only if you need BGP peering or a different LB mode.
# =============================================================================
[cilium]

# How Cilium's load balancer handles return traffic. `dsr` (Direct Server
# Return) preserves the client IP and is faster, but requires a switch
# fabric that won't drop asymmetric flows. `snat` masquerades the client
# and is the safe default for unknown topologies.
# REF: https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
# OPTIONAL. Default: "dsr". Allowed: "dsr" | "snat"

# loadbalancer_mode = "dsr"

# Cilium BGP peering — advertises Service IPs to your upstream router so
# LoadBalancer addresses become reachable from anywhere on your LAN
# (rather than only via L2 ARP). Set ALL THREE fields below to enable;
# leaving any blank disables BGP entirely.
# REF: https://docs.cilium.io/en/latest/network/bgp-control-plane/bgp-control-plane/
[cilium.bgp]

# IP of your BGP-speaking router. The cluster peers with it from each node.
# OPTIONAL. Example: "192.168.1.1"

# router_addr = ""

# ASN your router uses for BGP. Anything in the private range (64512-65534)
# is fine if you're not peering with the public internet.
# OPTIONAL. Example: "64513"

# router_asn = ""

# ASN the cluster's nodes use for BGP. Pick a different value than
# router_asn so peering is eBGP rather than iBGP.
# OPTIONAL. Example: "64514"

# node_asn = ""

# Hubble, Cilium's network flow observer, with its relay and its UI at
# https://hubble.<domain.name> on the internal gateway. The UI has no login,
# so the gateway signs users in with Pocket ID and admits only members of the
# Pocket ID group `cluster_admins`. Needs [pocket_id]. Create the OIDC client
# in the Pocket ID admin UI first, with the callback URL
# https://hubble.<domain.name>/oauth2/callback, then set BOTH fields below to
# enable; leaving them blank skips it. Enabling it restarts the Cilium agent
# on every node once.
# REF: https://docs.cilium.io/en/stable/observability/hubble/
[cilium.hubble]

# Client ID of the OIDC client created for Hubble in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_secret = ""


# =============================================================================
#    Talos Image Factory settings shared by all nodes.
# =============================================================================
[talos]

# Default schematic for every node that doesn't set its own schematic_id.
# The 64-character hex string from your build at https://factory.talos.dev/
# OPTIONAL if every node sets schematic_id itself.
schematic_id = ""


# =============================================================================
#    Postgres backups. Each database in the cluster backs up to this
#    S3-compatible object store (Cloudflare R2, Backblaze B2, MinIO, ...).
#    Set ALL FOUR fields below to enable; leaving them all blank disables
#    backups. The two keys are written to a SOPS-encrypted Secret.
# =============================================================================
[postgres.backup]

# S3 API endpoint of the object store: https and a hostname, no path.
# OPTIONAL. Example (R2): "https://<account-id>.r2.cloudflarestorage.com"

# endpoint = ""

# Bucket that holds the backups.
# OPTIONAL. Example: "home-cluster-pg"

# bucket = ""

# Access key pair with read and write access to the bucket's objects. For
# R2, create an API token with "Object Read & Write" scoped to the bucket.
# OPTIONAL.

# access_key_id = ""
# secret_access_key = ""


# =============================================================================
#    Observability stack: Prometheus, Alertmanager and Grafana
#    (kube-prometheus-stack), plus InfluxDB 2 for metrics pushed from outside
#    the cluster. Set ALL THREE fields below to enable; leaving them all blank
#    skips the stack. The values are written to SOPS-encrypted Secrets.
#    InfluxDB reads its password and token only on first start, so choose
#    them before the first deploy. Alertmanager sends alerts nowhere until
#    discord_webhook is set.
# =============================================================================
[observability]

# Password of the Grafana "admin" user.
# OPTIONAL.

# grafana_password = ""

# Password of the InfluxDB "admin" user, at least 8 characters.
# OPTIONAL.

# influxdb_password = ""

# InfluxDB admin API token. Grafana reads InfluxDB with it.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# influxdb_token = ""

# Discord webhook that Alertmanager sends alerts to. Needs the three fields
# above. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: "https://discord.com/api/webhooks/<id>/<token>"

# discord_webhook = ""

# Client ID of the OIDC client created for Grafana in the Pocket ID admin UI,
# with callback URL "https://grafana.<domain>/login/generic_oauth". Adds a
# Pocket ID button to the Grafana login page, next to the password form. Only
# members of the Pocket ID group "cluster_admins" can sign in with it, as
# Grafana server admins. Needs the three fields above and [pocket_id]; set it
# together with grafana_oidc_client_secret.
# OPTIONAL.

# grafana_oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# grafana_oidc_client_secret = ""

# Key Grafana encrypts its stored data source secrets with, at least 32
# characters. Grafana's advisor flags the built-in default. Needs the three
# fields above. It is written to a SOPS-encrypted Secret. Never change it once
# set: Grafana can no longer read what it encrypted with the old key.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# grafana_secret_key = ""

# Grafana plugins. Infinity (JSON, CSV and XML from any URL) is always
# installed, and so is the LLM app, which uses LocalAI, when the cluster
# has an NVIDIA GPU. The GitHub and Sentry data sources below are installed when
# their fields are set. Setup steps: private/grafana-plugins-setup.md.

# App ID of the GitHub App Grafana's GitHub data source signs in as, shown on
# the App's settings page. Needs the three fields above; set it together with
# github_app_installation_id and github_app_private_key.
# OPTIONAL. Example: "123456"

# github_app_id = ""

# Installation ID of that App: the last part of
# https://github.com/settings/installations/<id>.
# OPTIONAL. Example: "12345678"

# github_app_installation_id = ""

# Private key of that App, the whole PEM file GitHub downloads. It is written
# to a SOPS-encrypted Secret.
# OPTIONAL. Example:
# github_app_private_key = '''
# -----BEGIN RSA PRIVATE KEY-----
# ...
# -----END RSA PRIVATE KEY-----
# '''

# github_app_private_key = ""

# Slug of the Sentry organization Grafana's Sentry data source reads. Needs
# the three fields above; set it together with sentry_token.
# OPTIONAL. Example: "my-org"

# sentry_org = ""

# Token of a Sentry internal integration with Read on Project, Issue & Event
# and Organization. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# sentry_token = ""

# Address of Sentry: https and a hostname, no path. Regional organizations use
# their region's host.
# OPTIONAL. Default: "https://sentry.io"

# sentry_url = "https://sentry.io"

# Addresses of the Proxmox hosts. Prometheus scrapes node-exporter on port 9100
# of each, and Alertmanager alerts when a ZFS pool on one is not online (a
# page needs discord_webhook). Each host needs Debian's prometheus-node-exporter
# package installed, and port 9100 reachable from every node address, because
# Cilium masquerades pod traffic that leaves the cluster. Needs the three
# fields above.
# OPTIONAL. Example: ["10.10.10.2", "10.10.10.3"]

# proxmox_hosts = []


# =============================================================================
#    UniFi console. When set, the cluster writes a local DNS record to the
#    console for every app on the internal gateway, so internal names resolve
#    on your network without manual records. Needs UniFi Network 10.3.58 or
#    newer. Set BOTH fields below to enable; leaving them blank skips it.
# =============================================================================
[unifi]

# Address of the console: https and a hostname or IP, no path.
# When it is an IPv4 address, cluster DNS also forwards lookups for the domain
# to it, so pods resolve the names that exist only on the internal gateway.
# OPTIONAL. Example: "https://192.168.1.1"

# host = ""

# API key from the console: Settings > Control Plane > Integrations.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# api_key = ""


# =============================================================================
#    Pocket ID, a passkey login (OpenID Connect provider) for apps in the
#    cluster. Setting the key below deploys it at https://auth.<domain.name> on
#    the internal gateway, with its own Postgres database. Needs
#    [postgres.backup], because its passkeys and signing keys cannot be
#    recreated. Open https://auth.<domain.name>/setup right after the first
#    deploy: until an admin exists, anyone on your network can claim it.
# =============================================================================
[pocket_id]

# Encrypts the token signing keys in the database, at least 16 characters.
# It is written to a SOPS-encrypted Secret. To change it later, run
# `pocket-id encryption-key-rotate` in the pod first; editing it here alone
# makes the stored keys unreadable.
# OPTIONAL. Example: the output of `openssl rand -base64 32`

# encryption_key = ""

# Also serves Pocket ID on the external gateway, which exposes its sign-in
# page and its API to the internet. LAN clients and pods keep using the
# internal gateway. The hostname stays https://auth.<domain.name>, so passkeys
# keep working. Needs encryption_key and an ingress.mode other than "none".
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    Radar, a Kubernetes UI with a timeline, behind the Pocket ID login. Needs
#    [pocket_id]. Create the OIDC client for Radar in the Pocket ID admin UI
#    first, then set BOTH fields below to enable; leaving them blank skips it.
# =============================================================================
[radar]

# Client ID of the OIDC client created for Radar in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_secret = ""


# =============================================================================
#    matherlynet, the public website, at https://<domain.name> (www redirects
#    there) through the Cloudflare tunnel, with its own Postgres database.
#    Needs [postgres.backup], because its database holds accounts, and
#    ingress.mode "cloudflare-tunnel", because the site trusts the client
#    address Cloudflare reports. Set better_auth_secret and admin_email to
#    enable; leaving them blank skips it.
# =============================================================================
[matherlynet]

# Signs the site's sessions. Changing it signs everyone out.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -base64 32`

# better_auth_secret = ""

# Email address of the site's admin account.
# OPTIONAL. Example: "you@example.com"

# admin_email = ""

# SMTP server the site sends mail through, as a URL: smtps:// for implicit TLS
# (port 465), smtp:// for STARTTLS (port 587). A bare host name is rejected.
# Percent-encode any character in the username or password that is a quote, a
# backslash, a space, a dollar sign or an at sign (%40).
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: "smtp://user%40example.com:password@smtp.example.com:587"

# smtp_url = ""

# Sender of the site's mail.
# OPTIONAL. Example: "matherlynet <noreply@example.com>"

# mail_from = ""

# OAuth app for signing in with GitHub. Set both fields or neither. The
# secret is written to a SOPS-encrypted Secret.
# OPTIONAL.

# github_client_id = ""
# github_client_secret = ""

# OAuth client for signing in with Google. Set both fields or neither. The
# secret is written to a SOPS-encrypted Secret.
# OPTIONAL.

# google_client_id = ""
# google_client_secret = ""

# Lets the site call LocalAI for its playground. Needs a node that loads
# the nvidia kernel module.
# OPTIONAL. Default: false

# playground = false


# =============================================================================
#    Reactive Resume, a resume builder, at https://resume.<domain.name> on the
#    external gateway, with its own Postgres database and its uploads in an
#    S3-compatible bucket. Pocket ID is its only login. Needs
#    [postgres.backup], [pocket_id] and an ingress.mode other than "none".
#    Create the OIDC client in the Pocket ID admin UI first, with the callback
#    URL https://resume.<domain.name>/api/auth/callback/custom, and create the
#    bucket before the first deploy. Set ALL EIGHT fields below to enable;
#    leaving them all blank skips it. Every field except oidc_client_id and
#    s3_bucket is written to a SOPS-encrypted Secret.
# =============================================================================
[reactive_resume]

# Signs sessions and encrypts two-factor secrets. Never change it once people
# use the app: that signs everyone out and breaks their two-factor secrets.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# auth_secret = ""

# Encrypts the AI keys users save, at least 32 characters, different from
# auth_secret. Never change it: that makes every saved key unreadable.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# encryption_secret = ""

# Client ID of the OIDC client created for Reactive Resume in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created.
# OPTIONAL.

# oidc_client_secret = ""

# S3 API endpoint of the bucket for uploads: https and a hostname, no path.
# OPTIONAL. Example (R2): "https://<account-id>.r2.cloudflarestorage.com"

# s3_endpoint = ""

# Bucket that holds uploads. It must exist before the app starts.
# OPTIONAL. Example: "reactive-resume"

# s3_bucket = ""

# Access key pair with read and write access to the bucket's objects. For
# R2, create an API token with "Object Read & Write" scoped to the bucket.
# OPTIONAL.

# s3_access_key_id = ""
# s3_secret_access_key = ""


# =============================================================================
#    Redis. An app that needs Redis gets an instance of its own, in its own
#    namespace, from one shared definition (kubernetes/components/redis): Redis 8
#    with an append-only file on a volume, reachable only from that namespace.
#    Every instance takes this password. Leaving it blank disables the
#    component, and the apps that need it then refuse to enable.
# =============================================================================
[redis]

# At least 24 letters and digits. Clients put it in a connection URL as it is,
# so no other characters. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# password = ""


# =============================================================================
#    Kener, a status page with uptime monitoring, served at
#    https://status.<domain.name>. The internet reaches the status page through
#    the external gateway; the admin pages (/manage, /account) and the API
#    (/api) are served on the internal gateway only. Needs [postgres.backup],
#    [redis] and an ingress.mode other than "none". Set secret_key to enable;
#    leaving it blank skips it.
#
#    The first person to open /account/signin creates the admin account, so do
#    that right after the first deploy. Single sign-on is set up in Kener
#    itself, under Manage > OpenID Connect: create the client in the Pocket ID
#    admin UI with the callback URL
#    https://status.<domain.name>/account/oidc/callback, and add "groups" to
#    the scopes. Kener refuses an OIDC login whose email matches a local
#    account, so give the first admin a different address.
# =============================================================================
[kener]

# Signs sessions and API keys, at least 32 characters. Changing it signs
# everyone out and invalidates every API key.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# secret_key = ""

# Where Kener sends mail: alerts, invitations and subscriber updates. Kener
# needs a user and a password. smtps:// uses TLS from the first byte (port
# 465 unless given); smtp:// upgrades with STARTTLS (port 587 unless given).
# Percent-encode an at sign in the user or password (%40). Set mail_from too.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: "smtp://user%40example.com:password@smtp.example.com:587"

# smtp_url = ""

# Sender address of that mail. Set smtp_url too.
# OPTIONAL. Example: "status@example.com"

# mail_from = ""


# =============================================================================
#    Network Optimizer, which audits and monitors the UniFi network, served at
#    https://optimizer.<domain.name> on the internal gateway. It writes time
#    series to the InfluxDB in [observability], which it needs. Set
#    app_password to enable; leaving it blank skips it.
#
#    The UniFi connection (an API key from the console), the InfluxDB settings
#    and the Pocket ID role mapping are entered in the app's own Settings, not
#    here. For InfluxDB, create the buckets network_monitoring (90 days) and
#    network_monitoring_longterm (365 days) in org "home", and a token that can
#    read and write both. To sign in with Pocket ID, create the client in the Pocket ID
#    admin UI with the callback URL
#    https://optimizer.<domain.name>/signin-oidc/pocket-id, then map the
#    cluster_admins group to the Admin role in the app.
# =============================================================================
[network_optimizer]

# Password of the app's admin account, at least 8 characters with at least
# one digit. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 16`

# app_password = ""

# The OIDC client created for Network Optimizer in the Pocket ID admin UI.
# Needs [pocket_id]. Set both or neither.
# OPTIONAL.

# oidc_client_id = ""
# oidc_client_secret = ""


# =============================================================================
#    PegaProx, a web UI for managing Proxmox, served at
#    https://pegaprox.<domain.name> on the internal gateway. Set db_key to
#    enable; leaving it blank skips it.
#
#    The first visitor creates the admin account, so sign in right after the
#    first deploy. Proxmox hosts, users and the Pocket ID sign-in are set up in
#    the app's own UI and stored in its database, not here.
# =============================================================================
[pegaprox]

# Master key that encrypts PegaProx's database and the Proxmox credentials
# stored in it: 32 bytes as urlsafe base64 or as 64 hex characters. It is
# written to a SOPS-encrypted Secret. Never change it once set: the database
# becomes unreadable.
# OPTIONAL. Example: the output of
# `python3 -c 'import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())'`

# db_key = ""

# API token that Prometheus scrapes PegaProx's /api/metrics with. Create it in
# PegaProx under Settings, API Tokens, signed in as an admin account and with
# the admin role: the endpoint rejects a token of any other role. It is written
# to a SOPS-encrypted Secret. Needs [observability].
# OPTIONAL.

# metrics_token = ""


# =============================================================================
#    Actual Budget, a budgeting app, at https://budget.<domain.name> on the
#    internal gateway, and also on the external gateway with public = true.
#    Its budget files and account database are SQLite on a local-path volume.
#    Pocket ID is its only login. Needs [pocket_id]. Create the OIDC client in
#    the Pocket ID admin UI first, with the callback URL
#    https://budget.<domain.name>/openid/callback, then set BOTH client fields
#    below to enable; leaving them blank skips it.
#
#    The first Pocket ID sign-in becomes the owner and admin, so restrict the
#    client to a group in Pocket ID. Every later user is added by an admin in
#    Actual's User Directory, by Pocket ID username.
# =============================================================================
[actual_budget]

# Client ID of the OIDC client created for Actual Budget in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_secret = ""

# Also serves Actual Budget on the external gateway, so the internet reaches
# it. Needs the client fields above and pocket_id.public = true, because a
# visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    The media stack: Sonarr, Radarr, Prowlarr, SABnzbd, Bazarr, Tautulli,
#    Seerr, Maintainerr and Recyclarr, in the media namespace. Every app
#    mounts one NFS export from a Proxmox host. Every app is on the internal
#    gateway, and on the external one too with public = true. Seerr keeps its
#    own Plex login; the other apps sit behind a Pocket ID sign-in on the
#    gateway, which is their only login. Needs [pocket_id]. Set nfs_server to
#    enable; leaving it blank skips it, and then node, the API keys, the OIDC
#    client and recyclarr stay unset.
#
#    Create the OIDC client in the Pocket ID admin UI first, with one callback
#    URL per app, https://<app>.<domain.name>/oauth2/callback, for sonarr,
#    radarr, prowlarr, sabnzbd, bazarr, tautulli and maintainerr.
# =============================================================================
[media]

# The Proxmox host that exports the media tree over NFS.
# OPTIONAL. Example: "192.168.1.12"

# nfs_server = ""

# Path of the export on nfs_server.
# OPTIONAL. Default: "/srv/media"

# nfs_share = "/srv/media"

# The worker whose Proxmox host is nfs_server, so NFS traffic stays on that
# host. Must name a [[nodes]] entry with controller = false. The media
# PersistentVolume pins every pod that mounts it to this node, and that pin
# cannot change on a live volume: to move the stack later, scale the apps to
# zero and delete the media PersistentVolumeClaim and PersistentVolume first.
# REQUIRED when nfs_server is set. Example: "k8s-worker-4"

# node = ""

# Time zone the apps run in, as a tz database name.
# OPTIONAL. Default: "Etc/UTC". Example: "America/Chicago"

# timezone = "Etc/UTC"

# API keys, at least 32 letters and digits each. Each is a new random key;
# nothing is carried over from an earlier install. Every app reads its own key
# and the keys of the apps it talks to from one SOPS-encrypted Secret. Set all
# five or none.
# REQUIRED when nfs_server is set. Example: the output of `openssl rand -hex 16`

# sonarr_api_key = ""
# radarr_api_key = ""
# prowlarr_api_key = ""
# sabnzbd_api_key = ""
# sabnzbd_nzb_key = ""

# The OIDC client created for the media apps in the Pocket ID admin UI. The
# secret is written to a SOPS-encrypted Secret. Set both or neither.
# REQUIRED when nfs_server is set.

# oidc_client_id = ""
# oidc_client_secret = ""

# Runs Recyclarr, which syncs quality profiles into Sonarr and Radarr.
# OPTIONAL. Default: false

# recyclarr = false

# The Plex Media Server on the LAN and an X-Plex-Token for it. When set,
# Sonarr and Radarr get a Plex connection that refreshes the library on import,
# and Tautulli, Seerr and Maintainerr are deployed. Set both or neither. The
# token is written to a SOPS-encrypted Secret. Clearing the pair later removes
# those three apps and their config volumes (watch history, requests, rules), so
# to rotate the token change it in place rather than blanking it first.
# OPTIONAL. Example: plex_host = "192.168.1.60"

# plex_host = ""
# plex_token = ""

# Also attaches every app's route to the external gateway, so the internet
# reaches them through the tunnel behind the Pocket ID sign-in, except Seerr,
# which has only its own Plex login because household members use it. The /api
# routes stay on the internal gateway. Needs pocket_id.public = true, because
# a visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    LocalAI, the LLM server on the GPU node, serving Qwen3.5-4B to AI
#    Workspace, Grafana's LLM app and matherlynet's playground. It runs when a
#    node loads the nvidia kernel module, and then needs this key: every route
#    but the health checks refuses a request without it, and each client
#    sends it as a bearer token. The key is written to SOPS-encrypted Secrets.
# =============================================================================
[localai]
# At least 32 letters and digits.
# REQUIRED when a node loads the nvidia kernel module. Example: the output of
# `openssl rand -hex 32`

# api_key = ""

# Client ID of the OIDC client created for the LocalAI WebUI in Pocket ID.
# Setting BOTH fields turns on the WebUI at https://localai.<domain.name> on
# the internal gateway, where the gateway signs users in with Pocket ID and
# admits only members of the Pocket ID group `cluster_admins`. Needs
# [pocket_id]. The client's callback URL is
# https://localai.<domain.name>/oauth2/callback.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_secret = ""


# =============================================================================
#    AI Workspace, a multi-model chat UI, at https://ai.<domain.name> on the
#    internal gateway in the ai-workspace namespace, and also on the external
#    gateway with public = true. It signs users in itself with Pocket ID, its
#    only login. Needs [pocket_id] and [postgres.backup], which backs up its
#    database of accounts, sessions and shared chat links. Create the OIDC
#    client in the Pocket ID admin UI first: a confidential client with the
#    callback URL https://ai.<domain.name>/api/auth/callback/oidc, the logout
#    callback URL https://ai.<domain.name>/signin and the scopes openid, email
#    and profile. Then set the two client fields and auth_secret below to
#    enable; leaving them blank skips it. Turn off Pocket ID's "allow users to
#    edit their own account details" before admitting anyone: the app links a
#    Pocket ID sign-in to the account with the same email.
#
#    Chats stay in each browser. LocalAI is wired in when a node loads
#    the nvidia kernel module. Vendor API keys are brought by each user in the
#    browser, unless the server holds them through [ai_workspace.env] below.
#    Browsing (Attach > Web) runs a Chromium pod in the namespace that any
#    signed-in member can point at any public URL.
# =============================================================================
[ai_workspace]

# Client ID of the OIDC client created for AI Workspace's sign-in in Pocket
# ID.
# OPTIONAL.

# oidc_client_id = ""

# Client secret of that client. Pocket ID shows it once, when the client is
# created. It is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_secret = ""

# Signs the app's sessions, at least 32 characters. Changing it signs
# everyone out. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -base64 32`

# auth_secret = ""

# Who may sign in: exact addresses and @domain rules. A domain rule matches
# that domain only, not its subdomains. Empty lets in every Pocket ID user
# who can use the client. Both lists are written to a SOPS-encrypted Secret,
# so the addresses stay out of the public repo. Needs the client fields above.
# OPTIONAL. Default: []. Example: ["me@example.com", "@family.example.com"]

# allowed_emails = []

# Who is an admin: exact addresses, each admitted by allowed_emails when that
# is set. An admin can pull and delete Ollama models; the app reads roles
# from this list on every request. Needs the client fields above.
# OPTIONAL. Default: []. Example: ["me@example.com"]

# admin_emails = []

# Token that browserless, the Chromium pod behind Browsing, requires on its
# websocket. Letters and digits only, at least 32 characters, because it goes
# in a URL query string. Setting it runs the pod; blank skips it. It is
# written to the app's SOPS-encrypted Secret. Needs the client fields above.
# OPTIONAL. Example: the output of `openssl rand -hex 16`

# browsing_token = ""

# Also serves AI Workspace on the external gateway, so the internet reaches
# it. Needs the client fields above and pocket_id.public = true, because a
# visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false

# Extra server-side environment variables, one key per variable, such as
# vendor API keys. They are written to a SOPS-encrypted Secret, and the
# browser then sees those vendors as held by the server. Names are upper case;
# LOCALAI_API_HOST, LOCALAI_API_KEY, POSTGRES_PRISMA_URL,
# POSTGRES_URL_NON_POOLING, PORT, NODE_ENV, BROWSERLESS_TOKEN,
# PUPPETEER_WSS_ENDPOINT and every AUTH_* variable the templates set (AUTH_URL
# and AUTH_OIDC_ISSUER included) belong to the templates and are refused; AUTH_OIDC_NAME, the sign-in button label, is
# allowed. Needs the client fields above, and stays the last table in the
# section, because TOML closes [ai_workspace] at this header.
# OPTIONAL.
[ai_workspace.env]

# ANTHROPIC_API_KEY = ""
# OPENAI_API_KEY = ""
# GEMINI_API_KEY = ""


# =============================================================================
#    AI KB, a knowledge base with retrieval-augmented chat, served at
#    https://ai-kb.<domain.name> on both gateways. It has its own login.
#    Needs [postgres.backup], [redis] and an ingress.mode other than "none".
#    Set all three fields to enable; leaving them blank skips it.
#
#    Password sign-up stays open until the Pocket ID client fields below are
#    set; the external gateway answers 404 for the sign-up form, so accounts
#    are created from the LAN. With the client set, password sign-up is off
#    (invite_only) and a first Pocket ID sign-in creates an account. Create
#    the admin_email account first, then restart the app pod once
#    (`kubectl -n ai-kb rollout restart deployment ai-kb-app`), which promotes
#    that account to system administrator. Never change aes_key once set.
#
#    To sign in with Pocket ID, create the client in the Pocket ID admin UI
#    with the callback URL https://ai-kb.<domain.name>/api/v1/auth/oidc/callback.
#    The first Pocket ID sign-in with an address that already has an account
#    links to it; any other address gets a new account.
# =============================================================================
[ai_kb]

# Signs sessions, at least 32 characters. Changing it signs everyone out.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# jwt_secret = ""

# Encrypts the API keys and credentials AI KB stores, exactly 32 letters and
# digits. Never change it once set: what it encrypted becomes unreadable.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 16`

# aes_key = ""

# The account the app promotes to system administrator at startup, as long as
# no system administrator exists yet. Create that account first.
# OPTIONAL. Example: "admin@example.com"

# admin_email = ""

# The OIDC client created for AI KB in the Pocket ID admin UI.
# Needs [pocket_id]. Set both or neither.
# OPTIONAL.

# oidc_client_id = ""
# oidc_client_secret = ""

# The app's own RustFS key pair, letters and digits, at least 16 and 32. The
# provisioning Job creates the ai-kb-files bucket and scopes the pair to it,
# and a new workspace stores its files there instead of on the data-files
# volume; a workspace that exists keeps its backend until it is switched in
# the workspace settings. They are written to a SOPS-encrypted Secret.
# Needs [rustfs]. Set both or neither.
# OPTIONAL. Example: the output of `openssl rand -hex 16` and `-hex 32`

# rustfs_access_key = ""
# rustfs_secret_key = ""

# Sends traces to Langfuse, using the AI KB project key pair from [langfuse].
# AI KB wraps its chat, embedding, rerank, VLM and ASR models and its
# knowledge ingest and post-process paths in Langfuse tracers, so traces carry
# full prompts and answers and the chunk text of every ingested document. It
# stays off until AI KB's tracer has a metadata-only mode. Langfuse creates
# the project keys on its first start only, so a later change to the pair in
# cluster.toml must also be made in Langfuse's project settings, or every
# export gets 401 silently.
# Needs [langfuse].
# OPTIONAL. Default: false

# tracing = false

# Turns on GraphRAG: the chart's Neo4j runs in the ai-kb namespace on a 10Gi
# local-path volume, and a knowledge base with graph extraction on makes extra
# LocalAI calls for every document it imports. This is the password of Neo4j's
# neo4j user, letters and digits, at least 32. Neo4j stores it on its first
# start, so a later change must also be made inside Neo4j, or the app cannot
# sign in. The app tries Neo4j 30 times, two seconds apart, then exits, so on
# a fresh enable it restarts until Neo4j answers.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 16`

# neo4j_password = ""

# Turns on SearXNG, a metasearch engine in the ai-kb namespace that AI KB uses
# for web search. It is internal only and answers JSON only, with no route and
# the rate limiter off, and only the AI KB app pod can reach it. It queries
# SearXNG's default general engines (DuckDuckGo, Brave, Wikipedia and others);
# from one home address some answer with a CAPTCHA at times, and the answer
# lists them as unresponsive. This is its secret key, letters and digits, at
# least 32. After the next reconcile, add the provider in AI KB under
# Settings > Web Search, type SearXNG, with the Instance URL
# http://searxng.ai-kb.svc.cluster.local:8080.
# It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# searxng_secret = ""


# =============================================================================
#    RustFS, an S3-compatible object store for the cluster's own apps, at
#    http://rustfs-svc.rustfs.svc.cluster.local:9000 (path-style requests,
#    region us-east-1). It is not exposed on a gateway and its console is
#    off. Set all three fields to enable; leaving them blank skips it.
#
#    It runs standalone: one pod and one local-path volume on the worker in
#    node, so every object lives on that node's disk and nowhere else. An app
#    that stores files here sets its own key pair in its own section; a Job
#    then creates the app's bucket and a service account scoped to it.
# =============================================================================
[rustfs]

# Root access key, letters and digits, at least 16. It is written to a
# SOPS-encrypted Secret. Set all three fields together, or none.
# OPTIONAL. Example: the output of `openssl rand -hex 16`

# access_key = ""

# Root secret key, letters and digits, at least 32. It is written to a
# SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# secret_key = ""

# The worker that holds the volume: one of the [[nodes]] names, not a
# controller. The pod is pinned to it, because the volume cannot move.
# OPTIONAL. Example: "k8s-1"

# node = ""


# =============================================================================
#    Langfuse, LLM tracing for AI KB, served at https://langfuse.<domain.name>
#    on the internal gateway. It signs users in with Pocket ID itself.
#    Needs [postgres.backup], [redis], [pocket_id] and [rustfs].
#    Set all ten fields to enable; leaving them blank skips it.
#
#    Create the client in the Pocket ID admin UI with the callback URL
#    https://langfuse.<domain.name>/api/auth/callback/custom and restrict it
#    to the cluster_admins group: every Pocket ID user the client admits
#    joins the Home organization as an admin on first sign-in.
#
#    On its first start Langfuse creates the Home organization, the AI KB
#    project and that project's key pair from public_key and secret_key.
#    It only creates them when they are absent, so a later change to the pair
#    must also be made in the project settings.
# =============================================================================
[langfuse]

# The AI KB project's public key: "pk-lf-" and then at least 32 letters,
# digits or hyphens. Set all ten fields together, or none.
# OPTIONAL. Example: the output of `echo "pk-lf-$(uuidgen | tr A-Z a-z)"`

# public_key = ""

# The AI KB project's secret key: "sk-lf-" and then at least 32 letters,
# digits or hyphens. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `echo "sk-lf-$(uuidgen | tr A-Z a-z)"`

# secret_key = ""

# Hashes the API keys, letters and digits, at least 32. Never change it once
# set: every API key stops working. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c 48; echo`

# salt = ""

# Encrypts the LLM and integration keys Langfuse stores, exactly 64 hex
# characters. Never change it once set: what it encrypted becomes
# unreadable. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 32`

# encryption_key = ""

# Signs sessions, letters and digits, at least 32. Changing it signs
# everyone out. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c 48; echo`

# nextauth_secret = ""

# The OIDC client created by hand in the Pocket ID admin UI, with the callback
# URL https://langfuse.<domain.name>/api/auth/callback/custom and restricted
# to the cluster_admins group. Sign-up stays on, so the client's group is
# what decides who gets in. The secret is written to a SOPS-encrypted Secret.
# OPTIONAL.

# oidc_client_id = ""
# oidc_client_secret = ""

# The password of the langfuse user in the namespace's own ClickHouse,
# letters and digits, at least 24. It is written to a SOPS-encrypted Secret.
# OPTIONAL. Example: the output of `openssl rand -base64 48 | tr -dc A-Za-z0-9 | head -c 32; echo`

# clickhouse_password = ""

# The app's own RustFS key pair, letters and digits, at least 16 and 32. The
# provisioning Job creates the langfuse-events bucket and scopes the pair to
# it; Langfuse writes every raw event there before it processes it and reads
# them back for trace detail, so the bucket has no expiry and grows with
# tracing; measure it after a month. They are written to a SOPS-encrypted
# Secret.
# OPTIONAL. Example: the output of `openssl rand -hex 16` and `-hex 32`

# rustfs_access_key = ""
# rustfs_secret_key = ""


# =============================================================================
#    One [[nodes]] table per physical machine or VM in the cluster. At least
#    one controller (controller=true) is required; worker nodes are optional.
#    For HA, use 3 controllers. Controllers run ordinary workloads only when
#    the cluster has no workers; with at least one worker they keep the
#    control-plane NoSchedule taint.
#
#    Discover hardware details from a node already booted into Talos
#    maintenance mode:
#      talosctl get disks -n <node-ip> --insecure
#      talosctl get links -n <node-ip> --insecure
#    Schematic ID is the 64-character hex string from your build at:
#      https://factory.talos.dev/
#
#    The block below is a template — copy it once per node, uncomment, and
#    fill in the values.
# =============================================================================

# [[nodes]]
# name         = "k8s-0"        # Hostname: lowercase letters, digits and inner hyphens, up to 63 (not "global"/"controller"/"worker").
# address      = "192.168.1.10" # Static IP; must be inside network.node_cidr.
# controller   = true           # true = control-plane (etcd + API server), false = worker.
# disk         = "/dev/nvme0n1" # Block device or /dev/disk/by-id/... symlink to install Talos onto.
# mac_addr     = "aa:bb:cc:dd:ee:ff"  # Primary NIC MAC.
#
# # Optional when [talos] sets a cluster-wide default:
# schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"  # 64-hex from factory.talos.dev.
#
# # Optional advanced fields (each independently uncommentable):
# mtu            = 1500                       # Set only for jumbo frames / non-1500 MTUs (1450-9000).
# secureboot     = false                      # UEFI SecureBoot — requires a SecureBoot-enabled schematic.
# encrypt_disk   = false                      # TPM-bound full-disk encryption.
# kernel_modules = ["nvidia", "nvidia_uvm"]   # Only for schematics shipping matching extensions.
