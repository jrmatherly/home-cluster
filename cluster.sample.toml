#:schema ./cluster.schema.json
# =============================================================================
#    Physical LAN that your Talos nodes live on. Defines the address space
#    used for node IPs, the gateway/DNS/NTP servers nodes will use, and an
#    optional VLAN tag for switch ports that aren't natively tagged.
# =============================================================================
[network]

# The CIDR block your nodes' IPs come from. Every node's `address`, the Kube
# API VIP, and the gateway VIPs (internal/dns/external) must all sit inside
# this range (the gateway VIPs may sit outside it when [cilium.bgp] is set).
# REQUIRED. Example: "192.168.1.0/24"
node_cidr = ""

# Upstream DNS servers Talos nodes use for name resolution. Defaults to
# Cloudflare (1.1.1.1 / 1.0.0.1). Override if you run an internal resolver
# (Pi-hole, Unbound, AdGuard) or want a different public provider.
# OPTIONAL. Default: ["1.1.1.1", "1.0.0.1"]

# dns_servers = ["1.1.1.1", "1.0.0.1"]

# Upstream NTP servers. Defaults to Cloudflare's anycast NTP. Most homelabs
# don't need to change this.
# OPTIONAL. Default: ["162.159.200.1", "162.159.200.123"]

# ntp_servers = ["162.159.200.1", "162.159.200.123"]

# Default gateway IP that nodes use to reach the rest of your LAN/WAN.
# Defaults to the first usable host in node_cidr (e.g. 192.168.1.1 for
# 192.168.1.0/24), which is correct for most home routers. Override if your
# router lives at a non-standard address inside the subnet.
# OPTIONAL. Default: first IP in node_cidr

# default_gateway = ""

# 802.1Q VLAN tag to apply to the Talos node interface. Only set this if
# your switch ports are configured as trunks (passing tagged traffic to the
# nodes); access ports already untag VLAN traffic. Must be 1-4094.
# REF: https://www.talos.dev/latest/advanced/advanced-networking/#vlans
# OPTIONAL.

# vlan_tag = ""


# =============================================================================
#    Cluster-internal control plane and overlay networks. The pod and service
#    CIDRs are in-cluster only — they don't have to be routable on your LAN
#    and never appear on the wire outside the nodes.
# =============================================================================
[kubernetes]

# CIDR Cilium hands out to pods. /16 gives ~64K pod IPs, which is well beyond
# what a homelab needs but matches the upstream default. Must NOT overlap
# with node_cidr or svc_cidr.
# OPTIONAL. Default: "10.42.0.0/16"

# pod_cidr = "10.42.0.0/16"

# CIDR for ClusterIP services (the virtual IPs `kubectl get svc` shows).
# Same /16 reasoning as pod_cidr. Must NOT overlap with node_cidr or
# pod_cidr.
# OPTIONAL. Default: "10.43.0.0/16"

# svc_cidr = "10.43.0.0/16"

# ClusterIP for the CoreDNS Service. Must be inside svc_cidr.
# OPTIONAL. Default: the 10th IP in svc_cidr

# coredns_addr = ""

[kubernetes.api]

# Virtual IP for the Kubernetes API server. kubectl, flux, and every other
# client connect here on port 6443. Must be an unused IP inside
# network.node_cidr; Talos floats it across controller nodes as a Layer 2 VIP.
# REQUIRED.
addr = ""

# Additional Subject Alternative Names to put on the Kube API cert. Useful
# if you want to call the API by hostname (e.g. via a CNAME or local
# /etc/hosts entry) instead of the raw IP.
# OPTIONAL. Example: ["mycluster.example.com"]

# tls_sans = ["mycluster.example.com"]


# =============================================================================
#    LoadBalancer IPs that Cilium hands out to the cluster's edge gateways.
#    Each must be an unused address inside network.node_cidr (unless
#    [cilium.bgp] is set), and all four (these three plus kubernetes.api.addr)
#    must be distinct.
# =============================================================================
[gateways]

# IP for the `envoy-internal` gateway — used by HTTPRoutes intended for
# private/in-network access only. Most apps use this gateway by default.
# REQUIRED.
internal = ""

# IP for `k8s_gateway`, which serves DNS for cluster-managed hostnames.
# Point your home DNS server's conditional forwarder for domain.name
# at this IP to enable split-DNS resolution from your LAN.
# REQUIRED.
dns = ""

# IP for the `envoy-external` gateway — sits behind the ingress path (e.g.
# the cloudflared tunnel) and handles traffic exposed to the public
# internet. HTTPRoutes that reference this gateway become reachable via
# your public domain.
# REQUIRED unless ingress.mode is "none" (internal-only cluster).
external = ""


# =============================================================================
#    The Git repo Flux will sync from. This is the single source of truth
#    for everything in your cluster — once bootstrapped, changes are made by
#    pushing to this repo. Any Git host works: GitHub, GitLab, Gitea,
#    Forgejo, Codeberg or self-hosted.
# =============================================================================
[repository]

# Full clone URL of the repository this cluster will pull from.
# Must be the repo you cloned this template into.
# Use `https://` if the repo is publicly readable (or `http://` for a
# LAN-local git server). Use `ssh://git@` if it is
# private: the template then wires up a deploy key (`deploy.key.pub`) so
# Flux can clone over SSH; see the README for the extra setup step.
# REQUIRED. Examples:
#   "https://github.com/onedr0p/home-ops.git"
#   "ssh://git@gitlab.com/onedr0p/home-ops.git"
#   "ssh://git@git.example.com/k8s/home-ops.git"
url = ""

# Branch Flux watches. Changes pushed to this branch get reconciled into the
# cluster.
# OPTIONAL. Default: "main"

# branch = "main"

# Webhook payload format the Flux webhook Receiver verifies, so pushes are
# reconciled instantly. Gitea and Forgejo emulate GitHub webhooks, so keep
# "github" for them. Use "generic-hmac" for anything else that signs with
# HMAC; see https://fluxcd.io/flux/components/notification/receivers/
# Use "none" to skip the webhook entirely (e.g. your Git host cannot reach
# the cluster); Flux then only polls on an interval.
# OPTIONAL. Default: "github".
# Allowed: "github" | "gitlab" | "generic-hmac" | "none"

# webhook_provider = "github"

# SSH host keys for your Git host (`ssh-keyscan -t ed25519,ecdsa,rsa <host>`
# output). Only used with `ssh://` URLs. Keys for github.com, gitlab.com and
# codeberg.org are bundled; REQUIRED for any other host.
# OPTIONAL. Example:
#   known_hosts = """
#   git.example.com ssh-ed25519 AAAA...
#   """

# known_hosts = ""


# =============================================================================
#    The 1Password vault that External Secrets Operator reads deployment
#    secrets from, through a 1Password Connect server in the cluster. This file
#    holds no secret: each section below that needs one names its vault item,
#    titled after the section with hyphens, and the item's fields are the
#    upper-case labels listed in template/scripts/secret_map.py.
#    `just template secrets-check` reports a field that is missing or
#    malformed. REQUIRED: the domain and the DNS, tunnel and webhook tokens are
#    read from it too.
# =============================================================================
[onepassword]

# Name of the vault the Connect server can read. The name is rendered into
# this repo, so pick one you are content to publish. Letters, digits, `_`
# and `-` only.
# REQUIRED. Example: "homelab"

# vault = ""


# =============================================================================
#    The domain your cluster's hostnames live under. Used for every rendered
#    hostname (echo, flux-webhook, internal split DNS) and the wildcard
#    certificate, regardless of DNS provider.
# =============================================================================
[domain]

# REQUIRED. Example: "example.com"
name = ""


# =============================================================================
#    Public DNS authority and certificate issuance. With "cloudflare",
#    external-dns publishes records automatically and cert-manager issues a
#    Let's Encrypt wildcard via ACME DNS-01. With "none", nothing is
#    published and the wildcard certificate is issued by an in-cluster
#    self-signed CA instead (internal-only cluster).
# =============================================================================
[dns]

# OPTIONAL. Default: "cloudflare". Allowed: "cloudflare" | "none"

# provider = "cloudflare"

# With "cloudflare", the vault item `dns` holds TOKEN: a Cloudflare API token
# (NOT the global API key) with `Zone - DNS - Edit` and
# `Account - Cloudflare Tunnel - Read` permissions, scoped to the zone above.


# =============================================================================
#    How the public internet reaches the cluster's external gateway. With
#    "cloudflare-tunnel", cloudflared connects outbound so no ports are
#    forwarded (requires dns.provider = "cloudflare", tunnel_id below and the
#    vault item `cloudflare-tunnel`). With "direct", you forward TCP 443 (and
#    optionally 80) on your router to gateways.external and point an
#    `external.<domain>` DNS record at your WAN address (A record or DDNS
#    CNAME) yourself; per-app records are still published automatically.
#    With "none", nothing is exposed and apps are only reachable on your
#    LAN via the internal gateway.
# =============================================================================
[ingress]

# OPTIONAL. Default: "cloudflare-tunnel" when dns.provider is "cloudflare",
# otherwise "none". Allowed: "cloudflare-tunnel" | "direct" | "none"

# mode = "cloudflare-tunnel"

# ID of the Cloudflare tunnel: the TunnelID in the credentials file that
# `cloudflared tunnel create` writes. It is public, external.<domain.name> is
# a CNAME to it. The file's AccountTag and TunnelSecret go in the vault item
# `cloudflare-tunnel` as ACCOUNT_TAG and TUNNEL_SECRET.
# REQUIRED when mode is "cloudflare-tunnel".
# Example: "c1b2a3d4-0000-4000-8000-000000000000"
tunnel_id = ""


# =============================================================================
#    CNI configuration. Defaults are sane for most homelab setups; touch
#    this section only if you need BGP peering or a different LB mode.
# =============================================================================
[cilium]

# How Cilium's load balancer handles return traffic. `dsr` (Direct Server
# Return) preserves the client IP and is faster, but requires a switch
# fabric that won't drop asymmetric flows. `snat` masquerades the client
# and is the safe default for unknown topologies.
# REF: https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
# OPTIONAL. Default: "dsr". Allowed: "dsr" | "snat"

# loadbalancer_mode = "dsr"

# Cilium BGP peering — advertises Service IPs to your upstream router so
# LoadBalancer addresses become reachable from anywhere on your LAN
# (rather than only via L2 ARP). Set ALL THREE fields below to enable;
# leaving any blank disables BGP entirely.
# REF: https://docs.cilium.io/en/latest/network/bgp-control-plane/bgp-control-plane/
[cilium.bgp]

# IP of your BGP-speaking router. The cluster peers with it from each node.
# OPTIONAL. Example: "192.168.1.1"

# router_addr = ""

# ASN your router uses for BGP. Anything in the private range (64512-65534)
# is fine if you're not peering with the public internet.
# OPTIONAL. Example: "64513"

# router_asn = ""

# ASN the cluster's nodes use for BGP. Pick a different value than
# router_asn so peering is eBGP rather than iBGP.
# OPTIONAL. Example: "64514"

# node_asn = ""

# Hubble, Cilium's network flow observer, with its relay and its UI at
# https://hubble.<domain.name> on the internal gateway. The UI has no login,
# so the gateway signs users in with Pocket ID and admits only members of the
# Pocket ID group `cluster_admins`. Needs [pocket_id]. Create the OIDC client
# in the Pocket ID admin UI first, with the callback URL
# https://hubble.<domain.name>/oauth2/callback, then set the client ID below to
# enable; leaving it blank skips it. The client secret is OIDC_CLIENT_SECRET in
# the vault item `cilium-hubble`. Enabling it restarts the Cilium agent on
# every node once.
# REF: https://docs.cilium.io/en/stable/observability/hubble/
[cilium.hubble]

# Client ID of the OIDC client created for Hubble in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""


# =============================================================================
#    Talos Image Factory settings shared by all nodes.
# =============================================================================
[talos]

# Default schematic for every node that doesn't set its own schematic_id.
# The 64-character hex string from your build at https://factory.talos.dev/
# OPTIONAL if every node sets schematic_id itself.
schematic_id = ""


# =============================================================================
#    Spegel mirrors container images between nodes, so a pull can come from a
#    peer before it goes to the registry.
# =============================================================================
[spegel]

# Whether Spegel mirrors images between nodes.
# OPTIONAL. Default: true when more than one node is listed, false on a single node.

# enabled = true


# =============================================================================
#    Postgres backups. Each database in the cluster backs up to this
#    S3-compatible object store (Cloudflare R2, Backblaze B2, MinIO, ...).
#    Set BOTH fields below to enable; leaving them blank disables backups.
#    The vault item `postgres-backup` holds ACCESS_KEY_ID and
#    SECRET_ACCESS_KEY: a key pair with read and write access to the bucket's
#    objects (for R2, an API token with "Object Read & Write" scoped to it).
# =============================================================================
[postgres.backup]

# S3 API endpoint of the object store: https and a hostname, no path.
# OPTIONAL. Example (R2): "https://<account-id>.r2.cloudflarestorage.com"

# endpoint = ""

# Bucket that holds the backups.
# OPTIONAL. Example: "home-cluster-pg"

# bucket = ""


# =============================================================================
#    etcd snapshots. A daily snapshot goes to its own bucket at the endpoint
#    of [postgres.backup], which must be set. A snapshot holds every object in
#    the cluster, so this bucket and key pair are separate from the database
#    pair, which every database namespace can read. The vault item
#    `etcd-backup` holds BUCKET, ACCESS_KEY and SECRET_KEY; the keys are letters,
#    digits, - and _ only, because the job builds them into a URL. The control
#    planes must carry the Talos API access patch first: run `just talos apply`
#    before enabling it.
# =============================================================================
[etcd_backup]

# Takes the daily snapshot.
# OPTIONAL. Default: false

# enabled = false


# =============================================================================
#    Volume backups. Nightly copies of the volumes of PegaProx and Network
#    Optimizer and of AI KB's RustFS files go to one bucket at the endpoint of
#    [postgres.backup], which must be set, and are kept 7 days. A copy can hold
#    usable credentials, so this bucket and key pair are separate from the
#    database and etcd pairs. The vault item `volume-backup` holds BUCKET,
#    ACCESS_KEY and SECRET_KEY; the keys are letters, digits, - and _ only,
#    because the jobs build them into a URL.
# =============================================================================
[volume_backup]

# Runs the nightly copies.
# OPTIONAL. Default: false

# enabled = false


# =============================================================================
#    Observability stack: Prometheus, Alertmanager and Grafana
#    (kube-prometheus-stack), plus InfluxDB 2 for metrics pushed from outside
#    the cluster. The vault item `observability` holds GRAFANA_PASSWORD (the
#    Grafana "admin" user), INFLUXDB_PASSWORD (the InfluxDB "admin" user, at
#    least 8 characters) and INFLUXDB_TOKEN (the admin API token Grafana reads
#    InfluxDB with). InfluxDB reads its password and token only on first start,
#    so choose them before the first deploy. Alertmanager sends alerts nowhere
#    until discord is on.
# =============================================================================
[observability]

# Deploys the stack.
# OPTIONAL. Default: false

# enabled = false

# Alertmanager sends alerts to the Discord webhook in the vault field
# DISCORD_WEBHOOK ("https://discord.com/api/webhooks/<id>/<token>"). Needs
# enabled.
# OPTIONAL. Default: false

# discord = false

# Alertmanager pings the heartbeat check URL in the vault field HEARTBEAT_URL
# ("https://hc-ping.com/<uuid>") with the always-firing Watchdog alert, so a
# dead Prometheus, Alertmanager or node is noticed: the service pages when the
# pings stop. Pings arrive every 6 minutes, so set the check's period to 10
# minutes and its grace to 5: one missed ping does not page. A mistyped URL
# fails silently, so confirm the first ping on the service. It does not detect
# a broken Discord webhook. Needs discord.
# OPTIONAL. Default: false

# heartbeat = false

# Client ID of the OIDC client created for Grafana in the Pocket ID admin UI,
# with callback URL "https://grafana.<domain>/login/generic_oauth". Adds a
# Pocket ID button to the Grafana login page, next to the password form. Only
# members of the Pocket ID group "cluster_admins" can sign in with it, as
# Grafana server admins. Needs enabled and [pocket_id]. The client secret is
# the vault field GRAFANA_OIDC_CLIENT_SECRET.
# OPTIONAL.

# grafana_oidc_client_id = ""

# Grafana encrypts its stored data source secrets with the key in the vault
# field GRAFANA_SECRET_KEY, at least 32 characters, instead of its built-in
# default, which Grafana's advisor flags. Needs enabled. Never turn it off or
# change the key once set: Grafana can no longer read what it encrypted.
# OPTIONAL. Default: false

# secret_key = false

# Grafana plugins. Infinity (JSON, CSV and XML from any URL) is always
# installed, and so is the LLM app, which uses LocalAI, when the cluster
# has an NVIDIA GPU. The GitHub and Sentry data sources below are installed when
# their fields are set. Setup steps: private/grafana-plugins-setup.md.

# App ID of the GitHub App Grafana's GitHub data source signs in as, shown on
# the App's settings page. Needs enabled; set it together with
# github_app_installation_id. The App's private key, the whole PEM file GitHub
# downloads, is the vault field GITHUB_APP_PRIVATE_KEY.
# OPTIONAL. Example: "123456"

# github_app_id = ""

# Installation ID of that App: the last part of
# https://github.com/settings/installations/<id>.
# OPTIONAL. Example: "12345678"

# github_app_installation_id = ""

# Slug of the Sentry organization Grafana's Sentry data source reads. Needs
# enabled. The vault field SENTRY_TOKEN holds the token of a Sentry internal
# integration with Read on Project, Issue & Event and Organization.
# OPTIONAL. Example: "my-org"

# sentry_org = ""

# Address of Sentry: https and a hostname, no path. Regional organizations use
# their region's host.
# OPTIONAL. Default: "https://sentry.io"

# sentry_url = "https://sentry.io"

# Addresses of the Proxmox hosts. Prometheus scrapes node-exporter on port 9100
# of each, and Alertmanager alerts when a ZFS pool on one is not online (a
# page needs discord). Each host needs Debian's prometheus-node-exporter
# package installed, and port 9100 reachable from every node address, because
# Cilium masquerades pod traffic that leaves the cluster. Needs enabled.
# OPTIONAL. Example: ["10.10.10.2", "10.10.10.3"]

# proxmox_hosts = []


# =============================================================================
#    UniFi console. When set, the cluster writes a local DNS record to the
#    console for every app on the internal gateway, so internal names resolve
#    on your network without manual records. Needs UniFi Network 10.3.58 or
#    newer. Set host below to enable; leaving it blank skips it. The vault
#    item `unifi` holds API_KEY, an API key from the console: Settings >
#    Control Plane > Integrations.
# =============================================================================
[unifi]

# Address of the console: https and a hostname or IP, no path.
# When it is an IPv4 address, cluster DNS also forwards lookups for the domain
# to it, so pods resolve the names that exist only on the internal gateway.
# OPTIONAL. Example: "https://192.168.1.1"

# host = ""


# =============================================================================
#    Pocket ID, a passkey login (OpenID Connect provider) for apps in the
#    cluster, at https://auth.<domain.name> on the internal gateway, with its
#    own Postgres database. Needs [postgres.backup], because its passkeys and
#    signing keys cannot be recreated. The vault item `pocket-id` holds
#    ENCRYPTION_KEY, at least 16 characters, which encrypts the token signing
#    keys in the database. To change it later, run
#    `pocket-id encryption-key-rotate` in the pod first; changing it alone makes
#    the stored keys unreadable. Open https://auth.<domain.name>/setup right
#    after the first deploy: until an admin exists, anyone on your network can
#    claim it.
# =============================================================================
[pocket_id]

# Deploys Pocket ID.
# OPTIONAL. Default: false

# enabled = false

# Also serves Pocket ID on the external gateway, which exposes its sign-in
# page and its API to the internet. LAN clients and pods keep using the
# internal gateway. The hostname stays https://auth.<domain.name>, so passkeys
# keep working. Needs enabled and an ingress.mode other than "none".
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    Radar, a Kubernetes UI with a timeline, behind the Pocket ID login. Needs
#    [pocket_id]. Create the OIDC client for Radar in the Pocket ID admin UI
#    first, then set its ID below to enable; leaving it blank skips it. The
#    client secret is OIDC_CLIENT_SECRET in the vault item `radar`.
# =============================================================================
[radar]

# Client ID of the OIDC client created for Radar in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""


# =============================================================================
#    matherlynet, the public website, at https://<domain.name> (www redirects
#    there) through the Cloudflare tunnel, with its own Postgres database.
#    Needs [postgres.backup], because its database holds accounts, and
#    ingress.mode "cloudflare-tunnel", because the site trusts the client
#    address Cloudflare reports. The vault item `matherlynet` holds
#    BETTER_AUTH_SECRET, which signs the site's sessions (changing it signs
#    everyone out), and ADMIN_EMAIL, the address of the site's admin account.
# =============================================================================
[matherlynet]

# Deploys the site.
# OPTIONAL. Default: false

# enabled = false

# The site sends mail through the SMTP server in the vault field SMTP_URL, a
# URL: smtps:// for implicit TLS (port 465), smtp:// for STARTTLS (port 587),
# as in "smtp://user%40example.com:password@smtp.example.com:587". A bare host
# name is rejected. Percent-encode any character in the username or password
# that is a quote, a backslash, a space, a dollar sign or an at sign (%40).
# OPTIONAL. Default: false

# smtp = false

# The site's mail carries the sender in the vault field MAIL_FROM, as in
# "matherlynet <noreply@example.com>".
# OPTIONAL. Default: false

# mail = false

# OAuth app for signing in with GitHub: its client ID here, its secret in the
# vault field GITHUB_CLIENT_SECRET, and github = true. Set both or neither.
# OPTIONAL.

# github_client_id = ""
# github = false

# OAuth client for signing in with Google: its client ID here, its secret in
# the vault field GOOGLE_CLIENT_SECRET, and google = true. Set both or neither.
# OPTIONAL.

# google_client_id = ""
# google = false

# Lets the site call LocalAI for its playground. Needs a node that loads
# the nvidia kernel module.
# OPTIONAL. Default: false

# playground = false


# =============================================================================
#    Reactive Resume, a resume builder, at https://resume.<domain.name> on the
#    external gateway, with its own Postgres database and its uploads in an
#    S3-compatible bucket. Pocket ID is its only login. Needs
#    [postgres.backup], [pocket_id] and an ingress.mode other than "none".
#    Create the OIDC client in the Pocket ID admin UI first, with the callback
#    URL https://resume.<domain.name>/api/auth/callback/custom, and create the
#    bucket before the first deploy. Set ALL THREE fields below to enable;
#    leaving them unset skips it. The vault item `reactive-resume` holds
#    AUTH_SECRET (signs sessions and encrypts two-factor secrets, at least 32
#    characters; never change it once people use the app), ENCRYPTION_SECRET
#    (encrypts the AI keys users save, at least 32 characters, different from
#    AUTH_SECRET; never change it), OIDC_CLIENT_SECRET, S3_ENDPOINT (https and
#    a hostname, no path), S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY (a key
#    pair with read and write access to the bucket's objects).
# =============================================================================
[reactive_resume]

# Deploys Reactive Resume.
# OPTIONAL. Default: false

# enabled = false

# Client ID of the OIDC client created for Reactive Resume in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Bucket that holds uploads. It must exist before the app starts.
# OPTIONAL. Example: "reactive-resume"

# s3_bucket = ""


# =============================================================================
#    Redis. An app that needs Redis gets an instance of its own, in its own
#    namespace, from one shared definition (kubernetes/components/redis): Redis 8
#    with an append-only file on a volume, reachable only from that namespace.
#    Every instance takes the password in the vault item `redis`, field
#    PASSWORD: at least 24 letters and digits, because clients put it in a
#    connection URL as it is. Left off, the apps that need it refuse to enable.
# =============================================================================
[redis]

# Turns the component on.
# OPTIONAL. Default: false

# enabled = false


# =============================================================================
#    Kener, a status page with uptime monitoring, served at
#    https://status.<domain.name>. The internet reaches the status page through
#    the external gateway; the admin pages (/manage, /account) and the API
#    (/api) are served on the internal gateway only. Needs [postgres.backup],
#    [redis] and an ingress.mode other than "none". The vault item `kener`
#    holds SECRET_KEY, which signs sessions and API keys, at least 32
#    characters; changing it signs everyone out and invalidates every API key.
#
#    The first person to open /account/signin creates the admin account, so do
#    that right after the first deploy. Single sign-on is set up in Kener
#    itself, under Manage > OpenID Connect: create the client in the Pocket ID
#    admin UI with the callback URL
#    https://status.<domain.name>/account/oidc/callback, and add "groups" to
#    the scopes. Kener refuses an OIDC login whose email matches a local
#    account, so give the first admin a different address.
# =============================================================================
[kener]

# Deploys Kener.
# OPTIONAL. Default: false

# enabled = false

# Kener sends mail (alerts, invitations and subscriber updates) with the
# settings in the vault fields SMTP_HOST, SMTP_PORT, SMTP_SECURE ("1" for TLS
# from the first byte, "0" for STARTTLS), SMTP_USER, SMTP_PASS and MAIL_FROM,
# the sender address. Kener ignores them unless it has a host, a user and a
# password. Needs enabled.
# OPTIONAL. Default: false

# smtp = false


# =============================================================================
#    Network Optimizer, which audits and monitors the UniFi network, served at
#    https://optimizer.<domain.name> on the internal gateway. It writes time
#    series to the InfluxDB in [observability], which it needs. The vault
#    item `network-optimizer` holds APP_PASSWORD, the password of the app's
#    admin account: at least 8 characters with at least one digit.
#
#    The UniFi connection (an API key from the console), the InfluxDB settings
#    and the Pocket ID role mapping are entered in the app's own Settings, not
#    here. For InfluxDB, create the buckets network_monitoring (90 days) and
#    network_monitoring_longterm (365 days) in org "home", and a token that can
#    read and write both. To sign in with Pocket ID, create the client in the Pocket ID
#    admin UI with the callback URL
#    https://optimizer.<domain.name>/signin-oidc/pocket-id, then map the
#    cluster_admins group to the Admin role in the app.
# =============================================================================
[network_optimizer]

# Deploys Network Optimizer.
# OPTIONAL. Default: false

# enabled = false

# Client ID of the OIDC client created for Network Optimizer in the Pocket ID
# admin UI. Its secret is the vault field OIDC_CLIENT_SECRET. Needs enabled
# and [pocket_id].
# OPTIONAL.

# oidc_client_id = ""


# =============================================================================
#    PegaProx, a web UI for managing Proxmox, served at
#    https://pegaprox.<domain.name> on the internal gateway. The vault item
#    `pegaprox` holds DB_KEY, the master key that encrypts PegaProx's database
#    and the Proxmox credentials stored in it: 32 bytes as urlsafe base64 or as
#    64 hex characters. Never change it once set: the database becomes
#    unreadable.
#
#    The first visitor creates the admin account, so sign in right after the
#    first deploy. Proxmox hosts, users and the Pocket ID sign-in are set up in
#    the app's own UI and stored in its database, not here.
# =============================================================================
[pegaprox]

# Deploys PegaProx.
# OPTIONAL. Default: false

# enabled = false

# Prometheus scrapes PegaProx's /api/metrics with the API token in the vault
# field METRICS_TOKEN. Create it in PegaProx under Settings, API Tokens, signed
# in as an admin account and with the admin role: the endpoint rejects a token
# of any other role. Needs enabled and [observability].
# OPTIONAL. Default: false

# metrics = false


# =============================================================================
#    Actual Budget, a budgeting app, at https://budget.<domain.name> on the
#    internal gateway, and also on the external gateway with public = true.
#    Its budget files and account database are SQLite on a local-path volume.
#    Pocket ID is its only login. Needs [pocket_id]. Create the OIDC client in
#    the Pocket ID admin UI first, with the callback URL
#    https://budget.<domain.name>/openid/callback, then set its ID below to
#    enable; leaving it blank skips it. The client secret is OIDC_CLIENT_SECRET
#    in the vault item `actual-budget`.
#
#    The first Pocket ID sign-in becomes the owner and admin, so restrict the
#    client to a group in Pocket ID. Every later user is added by an admin in
#    Actual's User Directory, by Pocket ID username.
# =============================================================================
[actual_budget]

# Client ID of the OIDC client created for Actual Budget in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Also serves Actual Budget on the external gateway, so the internet reaches
# it. Needs the client ID above and pocket_id.public = true, because a
# visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    The media stack: Sonarr, Radarr, Prowlarr, SABnzbd, Bazarr, Tautulli,
#    Seerr, Maintainerr and Recyclarr, in the media namespace. Every app
#    mounts one NFS export from a Proxmox host. Every app is on the internal
#    gateway, and on the external one too with public = true. Seerr keeps its
#    own Plex login; the other apps sit behind a Pocket ID sign-in on the
#    gateway, which is their only login. Needs [pocket_id]. Set nfs_server to
#    enable; leaving it blank skips it, and then node, the OIDC client and
#    recyclarr stay unset.
#
#    The vault item `media` holds SONARR_API_KEY, RADARR_API_KEY,
#    PROWLARR_API_KEY, SABNZBD_API_KEY and SABNZBD_NZB_KEY, each a new random
#    key of at least 32 letters and digits, OIDC_CLIENT_SECRET, and PLEX_TOKEN
#    (an X-Plex-Token) when plex_host is set.
#
#    Create the OIDC client in the Pocket ID admin UI first, with one callback
#    URL per app, https://<app>.<domain.name>/oauth2/callback, for sonarr,
#    radarr, prowlarr, sabnzbd, bazarr, tautulli and maintainerr.
# =============================================================================
[media]

# The Proxmox host that exports the media tree over NFS.
# OPTIONAL. Example: "192.168.1.12"

# nfs_server = ""

# Path of the export on nfs_server.
# OPTIONAL. Default: "/srv/media"

# nfs_share = "/srv/media"

# The worker whose Proxmox host is nfs_server, so NFS traffic stays on that
# host. Must name a [[nodes]] entry with controller = false. The media
# PersistentVolume pins every pod that mounts it to this node, and that pin
# cannot change on a live volume: to move the stack later, scale the apps to
# zero and delete the media PersistentVolumeClaim and PersistentVolume first.
# REQUIRED when nfs_server is set. Example: "k8s-worker-4"

# node = ""

# Time zone the apps run in, as a tz database name.
# OPTIONAL. Default: "Etc/UTC". Example: "America/Chicago"

# timezone = "Etc/UTC"

# Client ID of the OIDC client created for the media apps in the Pocket ID
# admin UI.
# REQUIRED when nfs_server is set.

# oidc_client_id = ""

# Runs Recyclarr, which syncs quality profiles into Sonarr and Radarr.
# OPTIONAL. Default: false

# recyclarr = false

# The Plex Media Server on the LAN. When set, Sonarr and Radarr get a Plex
# connection that refreshes the library on import, and Tautulli, Seerr and
# Maintainerr are deployed. Clearing it later removes those three apps and
# their config volumes (watch history, requests, rules).
# OPTIONAL. Example: "192.168.1.60"

# plex_host = ""

# Also attaches every app's route to the external gateway, so the internet
# reaches them through the tunnel behind the Pocket ID sign-in, except Seerr,
# which has only its own Plex login because household members use it. The /api
# routes stay on the internal gateway. Needs pocket_id.public = true, because
# a visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false

# Raise it after changing a media key or the Plex token in the vault. The
# apps' HelmReleases carry it, so they are upgraded and their configure hooks
# push the new keys into the apps.
# OPTIONAL. Default: 0

# keys_revision = 0


# =============================================================================
#    LocalAI, the LLM server on the GPU node, serving Qwen3.5-4B to AI
#    Workspace, Grafana's LLM app and matherlynet's playground. It runs when a
#    node loads the nvidia kernel module, and then needs API_KEY in the vault
#    item `localai`, at least 32 letters and digits: every route but the health
#    checks refuses a request without it, and each client sends it as a bearer
#    token.
# =============================================================================
[localai]

# Client ID of the OIDC client created for the LocalAI WebUI in Pocket ID.
# Setting it turns on the WebUI at https://localai.<domain.name> on the
# internal gateway, where the gateway signs users in with Pocket ID and admits
# only members of the Pocket ID group `cluster_admins`. Needs [pocket_id]. The
# client's callback URL is https://localai.<domain.name>/oauth2/callback, and
# its secret is the vault field OIDC_CLIENT_SECRET.
# OPTIONAL.

# oidc_client_id = ""


# =============================================================================
#    AI Workspace, a multi-model chat UI, at https://ai.<domain.name> on the
#    internal gateway in the ai-workspace namespace, and also on the external
#    gateway with public = true. It signs users in itself with Pocket ID, its
#    only login. Needs [pocket_id] and [postgres.backup], which backs up its
#    database of accounts, sessions and shared chat links. Create the OIDC
#    client in the Pocket ID admin UI first: a confidential client with the
#    callback URL https://ai.<domain.name>/api/auth/callback/oidc, the logout
#    callback URL https://ai.<domain.name>/signin and the scopes openid, email
#    and profile. Then set the client ID below to enable; leaving it blank
#    skips it. The vault item `ai-workspace` holds OIDC_CLIENT_SECRET and
#    AUTH_SECRET, which signs the app's sessions, at least 32 characters
#    (changing it signs everyone out). Turn off Pocket ID's "allow users to
#    edit their own account details" before admitting anyone: the app links a
#    Pocket ID sign-in to the account with the same email.
#
#    Chats stay in each browser. LocalAI is wired in when a node loads
#    the nvidia kernel module. Vendor API keys are brought by each user in the
#    browser, unless the server holds them through env_keys below.
#    Browsing (Attach > Web) runs a Chromium pod in the namespace that any
#    signed-in member can point at any public URL.
# =============================================================================
[ai_workspace]

# Client ID of the OIDC client created for AI Workspace's sign-in in Pocket
# ID.
# OPTIONAL.

# oidc_client_id = ""

# Only the addresses and @domain rules in the vault field ALLOWED_EMAILS,
# joined by commas, may sign in. A domain rule matches that domain only, not
# its subdomains. Off, every Pocket ID user who can use the client may. The
# addresses are in the vault so they stay out of the public repo. Needs the
# client ID above.
# OPTIONAL. Default: false

# allowlist = false

# The exact addresses in the vault field ADMIN_EMAILS, joined by commas, are
# admins; each must be admitted by ALLOWED_EMAILS when allowlist is on. An
# admin can pull and delete Ollama models; the app reads roles from this list
# on every request. Needs the client ID above.
# OPTIONAL. Default: false

# admins = false

# Runs browserless, the Chromium pod behind Browsing, with the websocket token
# in the vault field BROWSING_TOKEN: letters and digits only, at least 32
# characters, because it goes in a URL query string. Needs the client ID
# above.
# OPTIONAL. Default: false

# browsing = false

# Also serves AI Workspace on the external gateway, so the internet reaches
# it. Needs the client ID above and pocket_id.public = true, because a
# visitor from the internet must reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false

# Names of extra server-side environment variables, such as vendor API keys.
# Each value is the field of that name in the vault item `ai-workspace-env`,
# and the browser then sees those vendors as held by the server. Names are
# upper case; LOCALAI_API_HOST, LOCALAI_API_KEY, POSTGRES_PRISMA_URL,
# POSTGRES_URL_NON_POOLING, PORT, NODE_ENV, BROWSERLESS_TOKEN,
# PUPPETEER_WSS_ENDPOINT and every AUTH_* variable the templates set (AUTH_URL
# and AUTH_OIDC_ISSUER included) belong to the templates and are refused;
# AUTH_OIDC_NAME, the sign-in button label, is allowed. Needs the client ID
# above.
# OPTIONAL. Default: []. Example: ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]

# env_keys = []


# =============================================================================
#    AI KB, a knowledge base with retrieval-augmented chat, served at
#    https://ai-kb.<domain.name> on both gateways. It has its own login.
#    Needs [postgres.backup], [redis] and an ingress.mode other than "none".
#    Set enabled and admin_email to enable. The vault item `ai-kb` holds
#    JWT_SECRET, which signs sessions, at least 32 characters (changing it
#    signs everyone out), and AES_KEY, exactly 32 letters and digits, which
#    encrypts the API keys and credentials AI KB stores.
#
#    Password sign-up stays open until the Pocket ID client ID below is
#    set; the external gateway answers 404 for the sign-up form, so accounts
#    are created from the LAN. With the client set, password sign-up is off
#    (invite_only) and a first Pocket ID sign-in creates an account. Create
#    the admin_email account first, then restart the app pod once
#    (`kubectl -n ai-kb rollout restart deployment ai-kb-app`), which promotes
#    that account to system administrator. Never change AES_KEY once set.
#
#    To sign in with Pocket ID, create the client in the Pocket ID admin UI
#    with the callback URL https://ai-kb.<domain.name>/api/v1/auth/oidc/callback.
#    The first Pocket ID sign-in with an address that already has an account
#    links to it; any other address gets a new account.
# =============================================================================
[ai_kb]

# Deploys AI KB.
# OPTIONAL. Default: false

# enabled = false

# The account the app promotes to system administrator at startup, as long as
# no system administrator exists yet. Create that account first.
# OPTIONAL. Example: "admin@example.com"

# admin_email = ""

# Client ID of the OIDC client created for AI KB in the Pocket ID admin UI.
# Its secret is the vault field OIDC_CLIENT_SECRET. Needs [pocket_id].
# OPTIONAL.

# oidc_client_id = ""

# Stores files in RustFS, with the app's own key pair in the vault fields
# RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY: letters and digits, at least 16 and
# 32. The provisioning Job creates the ai-kb-files bucket and scopes the pair
# to it, and a new workspace stores its files there instead of on the
# data-files volume; a workspace that exists keeps its backend until it is
# switched in the workspace settings. Needs [rustfs].
# OPTIONAL. Default: false

# rustfs = false

# Sends traces to Langfuse, using the AI KB project key pair from [langfuse].
# AI KB wraps its chat, embedding, rerank, VLM and ASR models and its
# knowledge ingest and post-process paths in Langfuse tracers, so traces carry
# full prompts and answers and the chunk text of every ingested document. It
# stays off until AI KB's tracer has a metadata-only mode. Langfuse creates
# the project keys on its first start only, so a later change to the pair in
# the vault must also be made in Langfuse's project settings, or every
# export gets 401 silently.
# Needs [langfuse].
# OPTIONAL. Default: false

# tracing = false

# Turns on GraphRAG: the chart's Neo4j runs in the ai-kb namespace on a 10Gi
# local-path volume, and a knowledge base with graph extraction on makes extra
# LocalAI calls for every document it imports. The vault field NEO4J_PASSWORD
# is the password of Neo4j's neo4j user, letters and digits, at least 32. Neo4j
# stores it on its first start, so a later change must also be made inside
# Neo4j, or the app cannot sign in. The app tries Neo4j 30 times, two seconds
# apart, then exits, so on a fresh enable it restarts until Neo4j answers.
# OPTIONAL. Default: false

# neo4j = false

# Turns on SearXNG, a metasearch engine in the ai-kb namespace that AI KB uses
# for web search. It is internal only and answers JSON only, with no route and
# the rate limiter off, and only the AI KB app pod can reach it. It queries
# SearXNG's default general engines (DuckDuckGo, Brave, Wikipedia and others);
# from one home address some answer with a CAPTCHA at times, and the answer
# lists them as unresponsive. The vault field SEARXNG_SECRET is its secret key,
# letters and digits, at least 32. After the next reconcile, add the provider
# in AI KB under Settings > Web Search, type SearXNG, with the Instance URL
# http://searxng.ai-kb.svc.cluster.local:8080.
# OPTIONAL. Default: false

# searxng = false


# =============================================================================
#    RustFS, an S3-compatible object store for the cluster's own apps, at
#    http://rustfs-svc.rustfs.svc.cluster.local:9000 (path-style requests,
#    region us-east-1). It is not exposed on a gateway and its console is
#    off. Set enabled and node to enable. The vault item `rustfs` holds the
#    root key pair, ACCESS_KEY and SECRET_KEY: letters and digits, at least 16
#    and 32.
#
#    It runs standalone: one pod and one local-path volume on the worker in
#    node, so every object lives on that node's disk and nowhere else. An app
#    that stores files here keeps its own key pair in its own vault item; a Job
#    then creates the app's bucket and a service account scoped to it.
# =============================================================================
[rustfs]

# Deploys RustFS.
# OPTIONAL. Default: false

# enabled = false

# The worker that holds the volume: one of the [[nodes]] names, not a
# controller. The pod is pinned to it, because the volume cannot move.
# OPTIONAL. Example: "k8s-1"

# node = ""

# Raise it after changing a consumer's key pair in the vault, so the
# provisioning Job is recreated and runs again.
# OPTIONAL. Default: 0

# keys_revision = 0


# =============================================================================
#    Langfuse, LLM tracing for AI KB, served at https://langfuse.<domain.name>
#    on the internal gateway. It signs users in with Pocket ID itself.
#    Needs [postgres.backup], [redis], [pocket_id] and [rustfs].
#    Set enabled and oidc_client_id to enable.
#
#    Create the client in the Pocket ID admin UI with the callback URL
#    https://langfuse.<domain.name>/api/auth/callback/custom and restrict it
#    to the cluster_admins group: every Pocket ID user the client admits
#    joins the Home organization as an admin on first sign-in. Sign-up stays
#    on, so the client's group is what decides who gets in.
#
#    The vault item `langfuse` holds PUBLIC_KEY and SECRET_KEY (the AI KB
#    project's key pair: "pk-lf-" or "sk-lf-" and then at least 32 letters,
#    digits or hyphens), SALT (hashes the API keys, letters and digits, at
#    least 32), ENCRYPTION_KEY (encrypts stored LLM and integration keys,
#    exactly 64 hex characters), NEXTAUTH_SECRET (signs sessions, letters and
#    digits, at least 32), OIDC_CLIENT_SECRET, CLICKHOUSE_PASSWORD (the
#    langfuse user in the namespace's own ClickHouse, letters and digits, at
#    least 24), and RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY (the app's own
#    RustFS pair, letters and digits, at least 16 and 32). Never change SALT
#    or ENCRYPTION_KEY once set: every API key stops working, and what was
#    encrypted becomes unreadable.
#
#    On its first start Langfuse creates the Home organization, the AI KB
#    project and that project's key pair from PUBLIC_KEY and SECRET_KEY.
#    It only creates them when they are absent, so a later change to the pair
#    must also be made in the project settings. The provisioning Job creates
#    the langfuse-events bucket; Langfuse writes every raw event there before
#    it processes it, so the bucket has no expiry and grows with tracing.
# =============================================================================
[langfuse]

# Deploys Langfuse.
# OPTIONAL. Default: false

# enabled = false

# Client ID of the OIDC client created for Langfuse in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""


# =============================================================================
#    It's a Plan, an issue tracker and project board, served at
#    https://plan.<domain.name> on the internal gateway. It has its own login:
#    the first account registered becomes the instance admin, and a Pocket ID
#    sign-in is added later in its god mode.
#    Needs [postgres.backup] and [rustfs].
#    The vault item `itsaplan` holds BETTER_AUTH_SECRET (signs sessions, at
#    least 32 characters), APP_ENCRYPTION_KEY (encrypts the AI provider keys
#    and integration credentials the app stores, at least 32 characters; never
#    change it once set), and RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY (the
#    app's own RustFS pair, letters and digits, at least 16 and 32, which the
#    provisioning Job scopes to the itsaplan-attachments bucket).
# =============================================================================
[itsaplan]

# Deploys It's a Plan.
# OPTIONAL. Default: false

# enabled = false


# =============================================================================
#    CLIProxyAPI, an OpenAI-, Anthropic- and Gemini-compatible proxy that pools
#    subscription logins (Claude, Codex and others) behind one API key, served
#    at https://llms.<domain.name>. Its management UI, CPA-Manager-Plus, is at
#    https://llms-admin.<domain.name>. Both are on the internal gateway only.
#    The manager's admin key is its only login, and the provider logins are
#    added in the manager UI.
#
#    The vault item `cliproxyapi` holds MANAGEMENT_KEY (the proxy's
#    remote-management key), API_KEY (the one client key for
#    https://llms.<domain.name>, sent as a bearer token) and MANAGER_ADMIN_KEY
#    (the manager's own login key), each at least 32 characters. The first two
#    are seeded into the app's config once: the app replaces the management key
#    with its bcrypt hash on the volume, and a later change reaches a running
#    proxy only by re-seeding, which resets every setting made in the manager
#    UI except the provider logins.
# =============================================================================
[cliproxyapi]

# Deploys the proxy and its manager.
# OPTIONAL. Default: false

# enabled = false

# Deploys Oh-My-CPA, a second console for the same proxy at
# https://llms-mgmt.<domain.name>, signed in with MANAGEMENT_KEY. The vault
# field OHMYCPA_MASTER_KEY is its at-rest encryption key for the stored
# credentials and usage payloads, exactly 64 hex characters. Never change it
# once the console has data, because nothing stored can be read without it.
# Needs enabled.
# OPTIONAL. Default: false

# ohmycpa = false

# Writes the GitHub token in the vault field GITHUB_TOKEN, a fine-grained
# token with no permissions, to the seed config for the proxy's plugin store:
# release lookups on the public plugin repositories run unauthenticated at 60
# requests an hour without it. A change reaches a running proxy only by
# re-seeding. Needs enabled.
# OPTIONAL. Default: false

# github = false


# =============================================================================
#    career-ops, a job-search dashboard, at https://career.<domain.name> on the
#    internal gateway, and also on the external gateway with public = true.
#    Pocket ID on the gateway is its only login. Its publish service serves
#    shared CV pages at https://cv.<domain.name> on the external gateway, with
#    its own Pocket ID sign-in on the account page. Both keep their data on
#    local-path volumes, backed up nightly to the [volume_backup] bucket.
#    Needs [pocket_id], [volume_backup] and ingress.mode "cloudflare-tunnel",
#    because the publish service reads each visitor's address from the header
#    Cloudflare sets.
#
#    Create two OIDC clients in the Pocket ID admin UI first: one with the
#    callback URL https://career.<domain.name>/oauth2/callback, restricted to
#    the cluster_admins group, and one with the callback URL
#    https://cv.<domain.name>/api/auth/callback/pocket-id. To enable, set
#    enabled and the two client IDs below.
#
#    The vault item `career-ops` holds OIDC_CLIENT_SECRET and
#    PUBLISH_OIDC_CLIENT_SECRET, PUBLISH_SECRET (signs the share pages' access
#    cookies and feedback links) and PUBLISH_AUTH_SECRET (Better Auth's secret
#    for the publish account page), each at least 32 characters,
#    PUBLISH_ALLOWED_EMAILS (the addresses, joined by commas, allowed to sign
#    in to https://cv.<domain.name>/account and mint API keys; Pocket ID must
#    report email_verified for them), and one Claude credential, named by
#    claude_credential below.
# =============================================================================
[career_ops]

# Deploys the dashboard and the publish service.
# OPTIONAL. Default: false

# enabled = false

# Client ID of the dashboard's OIDC client in Pocket ID.
# OPTIONAL.

# oidc_client_id = ""

# Which Claude credential the dashboard's scans run with. "oauth" reads the
# vault field CLAUDE_OAUTH_TOKEN, from `claude setup-token` on the Mac, which
# lasts one year. "proxy" reads ANTHROPIC_AUTH_TOKEN, the client key the
# dashboard sends to anthropic_base_url as a bearer token: the API_KEY of
# [cliproxyapi], or a key of its own, which the proxy's seed config then lists
# as a second client key so the usage pages show the dashboard's traffic
# apart.
# OPTIONAL. Default: "oauth". Allowed: "oauth" | "proxy"

# claude_credential = "oauth"

# The in-cluster CLIProxyAPI Service the dashboard's Claude CLI calls in place
# of Anthropic, so scans draw on the pooled [cliproxyapi] seats. The URL
# carries no /v1 and no trailing slash, and the proxy's NetworkPolicy admits
# the dashboard pod.
# REQUIRED when claude_credential is "proxy", unset otherwise.
# Example: "http://cliproxyapi.llms.svc.cluster.local:8317"

# anthropic_base_url = ""

# Client ID of the publish account page's OIDC client in Pocket ID.
# OPTIONAL.

# publish_oidc_client_id = ""

# Gives the dashboard's share features the API key in the vault field
# PUBLISH_API_KEY, minted after the first deploy: sign in at
# https://cv.<domain.name>/account with Pocket ID (type the URL, the share
# pages do not link it) and create a key; it is shown once. Turning it on
# restarts the dashboard pod. Needs enabled.
# OPTIONAL. Default: false

# publish = false

# Also serves the dashboard on the external gateway, so the internet reaches
# it. Needs pocket_id.public = true, because a visitor from the internet must
# reach the Pocket ID login.
# OPTIONAL. Default: false

# public = false


# =============================================================================
#    A self-hosted GitHub Actions runner scale set in the cluster, which the
#    weekly update-apps workflow uses for its apply job (`runs-on: home-cluster`).
#    The runner registers at repository scope, scales from zero and runs one
#    job at a time. The vault item `github-runner` holds TOKEN: a
#    fine-grained personal access token for the repository with the
#    Administration permission at Read and write, the only permission a
#    repository-level runner scale set needs. Give it an expiry and note the
#    date; the runner stops picking up jobs when it lapses.
# =============================================================================
[github_runner]

# Deploys the runner scale set.
# OPTIONAL. Default: false

# enabled = false


# =============================================================================
#    One [[nodes]] table per physical machine or VM in the cluster. At least
#    one controller (controller=true) is required; worker nodes are optional.
#    For HA, use 3 controllers. Controllers run ordinary workloads only when
#    the cluster has no workers; with at least one worker they keep the
#    control-plane NoSchedule taint.
#
#    Discover hardware details from a node already booted into Talos
#    maintenance mode:
#      talosctl get disks -n <node-ip> --insecure
#      talosctl get links -n <node-ip> --insecure
#    Schematic ID is the 64-character hex string from your build at:
#      https://factory.talos.dev/
#
#    The block below is a template — copy it once per node, uncomment, and
#    fill in the values.
# =============================================================================

# [[nodes]]
# name         = "k8s-0"        # Hostname: lowercase letters, digits and inner hyphens, up to 63 (not "global"/"controller"/"worker").
# address      = "192.168.1.10" # Static IP; must be inside network.node_cidr.
# controller   = true           # true = control-plane (etcd + API server), false = worker.
# disk         = "/dev/nvme0n1" # Block device or /dev/disk/by-id/... symlink to install Talos onto.
# mac_addr     = "aa:bb:cc:dd:ee:ff"  # Primary NIC MAC.
#
# # Optional when [talos] sets a cluster-wide default:
# schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"  # 64-hex from factory.talos.dev.
#
# # Optional advanced fields (each independently uncommentable):
# mtu            = 1500                       # Set only for jumbo frames / non-1500 MTUs (1450-9000).
# secureboot     = false                      # UEFI SecureBoot — requires a SecureBoot-enabled schematic.
# encrypt_disk   = false                      # TPM-bound full-disk encryption.
# kernel_modules = ["nvidia", "nvidia_uvm"]   # Only for schematics shipping matching extensions.
