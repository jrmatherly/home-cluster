[makejinja]
inputs = ["./template/overrides", "./template/config"]
output = "./"
# The sandbox leaves an empty .claude/.cc-writes in a shell's working directory.
exclude_patterns = ["*.partial.yaml.j2", ".claude", ".cc-writes"]
import_paths = ["./template/scripts"]
loaders = ["plugin:Plugin"]
jinja_suffix = ".j2"
copy_metadata = true
force = true
undefined = "strict"

[makejinja.delimiter]
block_start = "#%"
block_end = "%#"
comment_start = "#|"
comment_end = "#|"
variable_start = "#{"
variable_end = "}#"
